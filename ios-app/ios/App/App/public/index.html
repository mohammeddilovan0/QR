<style>
:root{

  --accent:#1f6f5c;--accent-ink:#ffffff;--exp:#b4432f;--inc:#1f7a4a;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);

  }
}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9d9b94;--line:#33322e;--soft:#282725;
  --accent:#4fb596;--accent-ink:#0c1f19;--exp:#ec8069;--inc:#5fc78d;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:calc(44px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* iPhone'da 16px'ten küçük yazı alanına dokununca sayfa yakınlaşıyor; engelle. */
@media (max-width:760px){input,select,textarea{font-size:16px!important}}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}

.grid{display:grid;gap:14px;grid-template-columns:1fr}

.num{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.exp{color:var(--exp)}.inc{color:var(--inc)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
@media (hover:hover){.btn:hover{background:var(--soft)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.05)}}

.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}

input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{font:inherit;color:inherit;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=color]{padding:2px;height:38px;width:48px}
label{display:block;font-size:13px;color:var(--muted)}

.form-row{display:grid;gap:10px;grid-template-columns:1fr;align-items:end}
@media (min-width:640px){.form-row{grid-template-columns:repeat(var(--cols,3),1fr) auto}}
.amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.amt input{border:0;border-radius:10px 0 0 10px}
.amt input:focus{outline:none}
.amt:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.amt span{padding:0 12px;color:var(--muted);font-weight:600;font-size:13px}
.amt.auto{background:var(--soft);border-style:dashed}
.amt.auto input{background:transparent}
.amt.auto::after{content:"otomatik";font-size:11px;color:var(--accent);font-weight:600;padding-right:10px}
.fxbox{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.fxbox .hint{margin-top:-6px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px;cursor:pointer}
.check input{width:auto;margin:0}
.accs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.acc .n{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.acc .n>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .n .cur{flex:none}
.networth{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:-4px 0 12px}
.acc .v{font-size:18px;font-weight:650;margin-top:2px}
.acc.group .sublines{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.subline{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.subline span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subline span:first-child::before{content:"↳ "}
.cur{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--muted)}
.periodbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pnav{display:flex;align-items:center;gap:6px}
.pnav .lbl{min-width:150px;text-align:center;font-weight:600}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--soft);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;cursor:pointer;border-radius:8px}
@media (hover:hover){.bar-row:hover .bar-lbl{text-decoration:underline}}
.bar-lbl{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar-row.sub{padding:2px 0;font-size:13px;color:var(--muted)}
.bar-row.sub .bar-lbl::before{content:"↳";margin-left:-4px}
.bar-row.sub .bar-track{height:6px}
.bar-row.sub .bar-fill{opacity:.65}
.list-row.child{padding-left:28px}
.list-row.child .m b{font-weight:500}
.caret{background:none;border:0;color:var(--muted);font:inherit;font-size:26px;line-height:1;width:28px;height:28px;margin:-4px -6px -4px -8px;padding:0;cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.cpick-btn.empty{color:var(--muted)}
.cpick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.cpick-btn::after{content:'›';font-size:22px;line-height:1;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.cpick-btn.open{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.cpick-btn.open::after{transform:rotate(-90deg)}
.cpick{margin-top:6px;border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;background:var(--card)}
.cpick-row{display:flex;align-items:center;gap:8px;padding:0 8px;border-top:1px solid var(--line)}
.cpick-row:first-child{border-top:0}
.cpick-row.child{padding-left:40px}
.cpick-row .nm{flex:1;min-width:0;background:none;border:0;text-align:left;padding:11px 0;cursor:pointer;color:var(--ink)}
.cpick-row.child .nm{color:var(--ink)}
.cpick-row.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cpick-row.sel .nm{font-weight:600}
.cpick-row .n{font-size:12px;color:var(--muted)}
.cpick-hd{padding:8px 10px 4px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.cpick-hd:first-child{border-top:0}
.fpick-btn{margin-top:0}
.caret-sp{width:14px;flex:none}
.list-row .m.tog{cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar-track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-val{text-align:right;white-space:nowrap}
.bar-val small{color:var(--muted);margin-left:4px}
.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.tbar{width:100%;max-width:46px;background:var(--line);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.tcol.cur .tbar{background:var(--accent)}
.tcol .tl{font-size:11px;color:var(--muted);white-space:nowrap}
.tcol .tv{font-size:11px;color:var(--muted);white-space:nowrap}
.filters{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr auto}}
.day{font-size:12px;color:var(--muted);font-weight:600;padding:12px 2px 6px;display:flex;justify-content:space-between}
.tx{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}
@media (hover:hover){.tx:hover{background:var(--soft)}}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:#fff}
.tx .m{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:650;text-align:right;white-space:nowrap}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .m{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px}
.chip.pick{border:1px solid var(--line);background:var(--card);padding:6px 12px;font-size:13px;cursor:pointer}
.chip.pick.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.toast.undo{display:flex;gap:12px;align-items:center}
.toast.undo.on{pointer-events:auto}
.toast .btn{color:var(--ink);padding:3px 10px}
.icon.xs{width:24px;height:24px;font-size:11px;border-radius:6px;vertical-align:middle;margin-left:6px}
.debt{flex-wrap:wrap}
.debt .pays,.debt .acts{flex-basis:100%}
.debt .pays{display:grid;gap:3px;border-left:2px solid var(--line);padding-left:10px}
.debt .acts{display:flex;gap:6px;justify-content:flex-end}
.warn{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}
.warn .m{flex:1;min-width:160px}
.warn .m b{display:block}
.ok{color:var(--inc)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
@keyframes flashUp{from{background:rgba(34,197,94,.35)}to{background:transparent}}
@keyframes flashDown{from{background:rgba(239,68,68,.35)}to{background:transparent}}
.gold-px{border-radius:8px;padding:0 4px;margin:0 -4px}
.gold-px.up{color:#16a34a;animation:flashUp 1s}
.gold-px.down{color:#dc2626;animation:flashDown 1s}
details{border-top:1px solid var(--line);margin-top:8px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:10px 0}
/* ---------- uygulama kabuğu: üst çubuk, büyük başlık, alt menü ---------- */
:root{--tabh:50px;--bar:color-mix(in srgb,var(--bg) 78%,transparent)}
html{background:var(--bg);overscroll-behavior-y:none;touch-action:manipulation}
/* Yakınlaştırma kapalı; hiçbir şey ekrandan taşıp sayfayı yana kaydırmasın. */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
.pnav{flex:1 1 auto;min-width:0}.pnav .lbl{flex:1;min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr))}
.kpi,.acc,.card,.m{min-width:0}
.big,.kpi .v,.acc .v{overflow-wrap:anywhere}
.bar-row{grid-template-columns:minmax(64px,140px) minmax(30px,1fr) auto}
.debt .pays{grid-template-columns:minmax(0,1fr);min-width:0}
.subline>span:last-child{flex:none}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
.navbar{position:fixed;top:0;left:0;right:0;z-index:10;padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));height:calc(44px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
body.scrolled .navbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line)}
.navbar .nt{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
body.scrolled .navbar .nt{opacity:1}
.navbar .nl{justify-self:start;display:flex}.navbar .nr{justify-self:end;display:flex;gap:4px}
.nav-txt{background:none;border:0;color:var(--accent);font:inherit;font-size:17px;padding:8px;min-height:44px;display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.nav-txt.b{font-weight:600}
.nav-txt:disabled{opacity:.35}
.nav-txt svg{width:22px;height:22px}
.nav-txt .chev{font-size:30px;line-height:0;margin:-2px 2px 0 -4px;font-weight:300}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
.lt h1{font-size:32px;line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:750}
.lt .seg button{padding:5px 10px;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabbar button{flex:1;max-width:120px;height:var(--tabh);background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:10px;font-weight:500;cursor:pointer;padding:4px 0 0}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,calc(50vw - 474px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:9;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.92)}
body:not(.has-fab) .fab{display:none}
/* Daha fazla menüsü: iOS Ayarlar gibi gruplu liste */
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line)}
.gitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0 0 0 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.gitem .gi{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.gitem .gi svg{width:19px;height:19px}
.gitem .gt{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 13px 0;border-top:.5px solid var(--line);min-height:50px}
.gitem:first-child .gt{border-top:0}
.gitem .gv{color:var(--muted);display:flex;align-items:center;gap:6px}
.chev-r{color:var(--muted);opacity:.6;font-size:22px;line-height:1}
.mseg{display:flex;width:100%;margin-bottom:14px}.mseg button{flex:1}
/* Görünüm geçişi ve dokunma tepkileri */
#view.enter{animation:viewIn .24s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn,.seg button,.chip.pick,.icon,.nav-txt,.tabbar button,.gitem,.caret{transition:transform .12s,opacity .12s,background .15s}
.btn:active,.chip.pick:active,.icon:active{transform:scale(.96);opacity:.75}
.nav-txt:active,.tabbar button:active{opacity:.45}
.acc.tap{cursor:pointer}.acc.tap:active,.subline.tap:active{background:var(--soft)}
.subline.tap{cursor:pointer;border-radius:6px;margin:0 -4px;padding:2px 4px}
.tx:active,.list-row.tap:active,.gitem:active,.bar-row:active,.list-row .m.tog:active{background:var(--soft)}
.list-row.tap{cursor:pointer}
/* Kaydırarak sil */
.sw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.sw>.sw-row{position:relative;z-index:1;background:var(--card);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.sw>.sw-row>.list-row{border-top:0}
.sw-acts{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
/* Silme düğmesi sadece satır kaydırılırken görünür (köşelerden sızmasın). */
.sw:has(>.sw-row[style*=translate]) .sw-acts{visibility:visible}
.sw-btn{border:0;color:#fff;font:inherit;font-size:14px;font-weight:600;padding:0 18px;min-width:76px;cursor:pointer}
.sw-btn.del{background:#e5484d}.sw-btn.edit{background:#8e8e93}.sw-btn.ok{background:var(--accent);color:var(--accent-ink)}
#txlist .sw{border-top:0;border-radius:10px}
.card>.sw:first-child{border-top:0}
/* Bildirim açık panellerin de üstünde görünsün (popover). */
.toast[popover]{inset:auto auto calc(var(--tabh) + 84px + env(safe-area-inset-bottom)) 50%;margin:0;border:0;overflow:visible;max-width:calc(100vw - 32px)}
/* Alttan açılan paneller */
dialog{color:var(--ink)}
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto var(--kb,0px);width:100%;max-width:560px;max-height:calc(var(--vvh,100dvh) - env(safe-area-inset-top) - 10px);border:0;border-radius:14px 14px 0 0;padding:0 0 env(safe-area-inset-bottom);background:var(--card);overflow:auto;overscroll-behavior:contain;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
dialog.sheet{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
dialog.sheet[open]{animation:sheetIn .38s cubic-bezier(.32,.72,0,1)}
dialog.sheet.closing{animation:sheetOut .22s ease-in forwards}
dialog.sheet::backdrop{background:rgba(0,0,0,.42);animation:fadeIn .3s}
dialog.sheet.closing::backdrop{animation:fadeOut .22s forwards}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(110%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet-nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 6px 4px;background:var(--card);border-bottom:.5px solid var(--line);touch-action:none;cursor:grab}
.sheet-nav h2{margin:0;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet-nav .nav-txt:first-of-type{justify-self:start}.sheet-nav .nav-txt.b{justify-self:end}
.grab{position:absolute;top:5px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.dlg{display:block}
.sheet-body{padding:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
/* iPhone'da tarih/saat kutusu kendi genişliğini dayatıp paneli yana taşırıyordu. */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:42px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
dialog.sheet{overflow-x:hidden;touch-action:pan-y}
.btn.block{width:100%;padding:12px;font-weight:600}
.btn.danger.block{background:color-mix(in srgb,var(--exp) 12%,var(--card));border-color:transparent}
/* Onay menüsü (iOS eylem menüsü gibi) */
#askDlg{background:transparent;box-shadow:none;padding:0 8px calc(8px + env(safe-area-inset-bottom));overflow:visible}
.ask-box{background:var(--card);border-radius:14px;overflow:hidden;text-align:center}
.ask-box .ah{padding:16px 16px 14px;color:var(--muted);font-size:13px;border-bottom:.5px solid var(--line)}
.ask-box .ah b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.ask-btn{display:block;width:100%;border:0;background:var(--card);color:var(--accent);font:inherit;font-size:19px;padding:16px;cursor:pointer}
.ask-btn.danger{color:#e5484d}
.ask-btn.cancel{margin-top:8px;border-radius:14px;font-weight:600}
.ask-btn:active{background:var(--soft)}
/* Silinenler */
.trash .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.trash .ic svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*,::backdrop{animation:none!important;transition:none!important}}
/* Rapor sadece yazdırırken (PDF) görünür; her zaman açık renkte basılır. */
#report{display:none}
@media print{
  :root,:root[data-theme],:root:not([data-theme="light"]){
    --bg:#fff;--card:#fff;--ink:#1c1c1a;--muted:#6d6b65;--line:#dedcd5;--soft:#f1efe9;--accent:#1f6f5c;--exp:#b4432f;--inc:#1f7a4a;
  }
  @page{margin:12mm}
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing .wrap,body.printing .fab,body.printing .toast,body.printing dialog,body.printing .navbar,body.printing .tabbar{display:none!important}
  body.printing #report{display:block}
  #report h1{font-size:22px;margin:2px 0 0}
  #report h3{margin:18px 0 6px;break-after:avoid}
  #report .rp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:8px}
  #report .kpis{grid-template-columns:repeat(4,1fr)}
  #report .kpi small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
  #report .kpi .v{font-size:16px}
  #report td,#report th{padding:5px 4px;vertical-align:top}
  #report tr{break-inside:avoid}
  #report .r{text-align:right}
  #report .nw{white-space:nowrap}
  #report .dot{display:inline-block;margin-right:6px}

}

.list-row.rem{align-items:flex-start;gap:12px}
.rchk{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);background:none;flex:none;padding:0;margin-top:1px;cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .12s}

.rem .rl{margin-left:auto;white-space:nowrap}
.rpri{font-weight:800}.rpri.p1{color:#3b82c4}.rpri.p2{color:#e8a33d}.rpri.p3{color:#e5484d}
.rbadge{background:#e5484d;color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}

.rnewlist{display:flex;gap:8px;margin-top:10px;align-items:center}

.rnewlist [data-rem-newname]{flex:1}

.rtitle{font-size:17px!important;font-weight:600;padding:11px 12px}
@keyframes kbIn{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

<div class="navbar">

  <form class="dlg" id="txForm" novalidate>

<script>
/* Varsayılan canlı kur köprüsü: yeni cihazda da kurlar hemen canlı gelir. */
const DEF_BRIDGE = 'https://kur.mohammeddilovan0.workers.dev';
const KEY = 'kisisel-hesap-v1';
const PALETTE = ['#d9534f','#e8a33d','#3b82c4','#2e9e6b','#9b59b6','#e76f51','#14b8a6','#8d6e63','#64748b','#c2410c','#db2777','#65a30d'];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);

/* ---------- veri ---------- */
/* Hatırlatıcı listelerinin başlangıç hâli; kullanıcı ekler, yeniden adlandırır, siler (Genel silinmez). */
const REM_LIST_DEF = [['genel', 'Genel', '#8e8e93'], ['odeme', 'Ödemeler', '#30a46c'], ['is', 'İş', '#3b82c4'], ['ev', 'Ev', '#e8a33d'],
  ['saglik', 'Sağlık', '#e5484d'], ['alisveris', 'Alışveriş', '#9b59b6'], ['kisisel', 'Kişisel', '#14b8a6']].map(([id, name, color]) => ({ id, name, color }));
function seed() {
  const c = (name, type, i) => ({ id: uid(), name, type, color: PALETTE[i % PALETTE.length] });
  return {
    version: 1,
    rates: [{ id: uid(), date: today(), rate: 1310 }],
    accounts: [
      { id: uid(), name: 'Nakit Dinar', currency: 'IQD', opening: 0 },
      { id: uid(), name: 'Nakit Dolar', currency: 'USD', opening: 0 },
    ],
    categories: (() => {
      const yemek = c('Yemek', 'expense', 0), araba = c('Araba', 'expense', 2);
      const sub = (p, name) => ({ ...c(name, p.type, 0), color: p.color, parentId: p.id });
      return [
        yemek, sub(yemek, 'Market'), sub(yemek, 'Restoran'),
        araba, sub(araba, 'Benzin'), sub(araba, 'Bakım / Tamir'), sub(araba, 'Yıkama'),
        c('Faturalar', 'expense', 4), c('Diğer', 'expense', 7),
        c('Maaş', 'income', 6), c('Diğer gelir', 'income', 11),
      ];
    })(),
    tx: [],
    debts: [],
    reminders: [],
    remLists: JSON.parse(JSON.stringify(REM_LIST_DEF)),
    trash: [],
    settings: { display: 'IQD', weekStart: 1, lastBackup: '', rateCity: 'erbil', bridge: DEF_BRIDGE, goldCity: 'erbil' },
  };
}
/* Eski kayıtlarda/yedeklerde olmayan alanları tamamlar (ör. borç/alacak listesi). */
function norm(d) {
  if (!Array.isArray(d.debts)) d.debts = [];
  if (!Array.isArray(d.trash)) d.trash = [];
  // Kategori zincirinde döngü varsa kır; alt kategorinin türü kökünkiyle aynı olsun.
  const byId = new Map((d.categories || []).map(c => [c.id, c]));
  for (const c of d.categories || []) {
    const seen = new Set([c.id]);
    let p = byId.get(c.parentId), root = c;
    while (p) { if (seen.has(p.id)) { c.parentId = ''; root = c; break; } seen.add(p.id); root = p; p = byId.get(p.parentId); }
    if (root !== c && root.type) c.type = root.type;
  }
  if (!Array.isArray(d.reminders)) d.reminders = [];
  if (!Array.isArray(d.remLists) || !d.remLists.length) d.remLists = JSON.parse(JSON.stringify(REM_LIST_DEF));
  d.remLists = d.remLists.filter(l => l && l.id && typeof l.name === 'string' && l.name.trim())
    .map(l => ({ id: String(l.id), name: l.name.trim().slice(0, 30), color: /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : '#8e8e93' }));
  if (!d.remLists.some(l => l.id === 'genel')) d.remLists.unshift(Object.assign({}, REM_LIST_DEF[0]));
  d.reminders = d.reminders.filter(r => r && r.id && typeof r.title === 'string' && (!r.date || /^\d{4}-\d\d-\d\d$/.test(r.date)));
  d.trash = d.trash.filter(x => x && x.id && x.kind && x.data && typeof x.data === 'object');
  d.debts.forEach(x => {
    if (!Array.isArray(x.payments)) x.payments = [];
    x.payments.forEach(p => { if (!p.accountId) p.accountId = ''; if (!p.txId) p.txId = ''; });
    if (!x.accountId) x.accountId = '';
    if (!x.txId) x.txId = '';
    x.opening = !!x.opening;
  });
  d.settings = Object.assign({ display: 'IQD', weekStart: 1, lastBackup: '', rateCity: 'erbil', bridge: '' }, d.settings);
  if (!/^https:\/\/[^\s/]+\.[^\s]+$/.test(d.settings.bridge || '')) d.settings.bridge = '';
  if (!d.settings.bridge && !d.settings.bridgeOff) d.settings.bridge = DEF_BRIDGE;
  if (!['erbil', 'baghdad', 'basra'].includes(d.settings.goldCity)) d.settings.goldCity = 'erbil';
  // Transfer ücretleri ayrı bir kalem yerine bir gider kategorisine sayılabilir; ilk seferde "commission/komisyon" varsa o seçilir.
  if (d.settings.feeCat === undefined) {
    const k = (d.categories || []).find(c => c.type === 'expense' && !c.parentId && /^(commission|komisyon)/i.test(c.name || ''));
    d.settings.feeCat = k ? k.id : '';
  }
  return clean(d);
}
/* Güvenlik: kimlik, tarih, renk gibi alanlar ekrana kaçışsız yazılır. Dışarıdan gelen (ör. birinin gönderdiği)
   bir yedek dosyası bu alanlara kod gizleyemesin diye, serbest yazı alanları dışındaki metinlerden HTML karakterleri atılır. */
const TEXT_KEYS = new Set(['name', 'note', 'person', 'bridge', 'reason', 'label', 'sub', 'title']);
function clean(v, k) {
  if (typeof v === 'string') return TEXT_KEYS.has(k) ? v : v.replace(/[<>"'`&\\]/g, '');
  if (Array.isArray(v)) return v.map(x => clean(x, k));
  if (v && typeof v === 'object') { for (const key of Object.keys(v)) v[key] = clean(v[key], key); }
  return v;
}
function load() {
  try { const s = localStorage.getItem(KEY); return s ? norm(JSON.parse(s)) : null; } catch (e) { return null; }
}

const ui = {

const acc = id => db.accounts.find(a => a.id === id);

/* Kategoriler iki seviyeli: ana kategori ve (parentId ile) alt kategori. */

const catPath = id => { const out = []; let c = cat(id); while (c && !out.includes(c) && out.length < 20) { out.unshift(c); c = c.parentId ? cat(c.parentId) : null; } return out; };

/* Açılır/kapanır kategori listesi (işlem formu ve İşlemler filtresi ortak kullanır).

/* Formlarda kademeli kategori seçici (ok ile alt seviyeler açılır). Değer gizli input'ta tutulur.

/* ---------- kur & para ---------- */
/* Sıralı kur listesi önbellekte tutulur (rateAt her işlem için çağrılıyor); kur listesi değişince yenilenir. */
let rateMemo = { src: null, n: -1, last: null, list: [] };
function sortedRates() {
  const r = db.rates, last = r[r.length - 1];
  if (rateMemo.src !== r || rateMemo.n !== r.length || rateMemo.last !== last || (last && rateMemo.lastRate !== last.rate))
    rateMemo = { src: r, n: r.length, last, lastRate: last && last.rate, list: [...r].sort((a, b) => a.date.localeCompare(b.date)) };
  return rateMemo.list;
}
function curRate() { const r = sortedRates(); return r.length ? r[r.length - 1].rate : 1310; }
/* Bugünkü değerleme kuru (bakiyeler, net servet, açık borçlar): canlı Erbil kuru; alınamazsa en son kayıtlı kur.
   Geçmiş işlemler her zaman kendi tarihindeki kurla çevrilir (rateAt). */
const liveErbil = () => live.data && live.data.erbil ? live.data.erbil : null;
function nowRate() { const x = liveErbil(); return x ? x.rate : curRate(); }
function nowRateNote() {
  const x = liveErbil(), r = nowRate(), v = fmtNum(r, r % 1 ? 2 : 0);
  if (x) return `Erbil canlı kuruyla: 1 $ = ${v} IQD · ${ago(x.at)}`;
  return `Kayıtlı kurla: 1 $ = ${v} IQD${db.settings.bridge ? ' · canlı kur bekleniyor' : ''}`;
}
function rateAt(date) {
  const rs = sortedRates(); let r = rs.length ? rs[0].rate : 1310;
  for (const x of rs) { if (x.date <= date) r = x.rate; else break; }
  return r;
}
function conv(v, from, to, rate) {
  if (from === to) return v;
  return from === 'USD' ? v * rate : v / rate;
}
/* Sayı biçimi: nokta ondalık, virgül binlik ayırıcı (20.32 · 3,200 · 1,250,000). */
function fmtNum(n, dec = 0) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmt(n, cur, signed = false) {
  const neg = n < 0 && Math.abs(n) >= (cur === 'USD' ? 0.005 : 0.5);
  const sign = neg ? '−' : (signed && n > 0 ? '+' : '');
  const a = Math.abs(n);
  return cur === 'USD' ? `${sign}$${fmtNum(a, 2)}` : `${sign}${fmtNum(a)} IQD`;
}
function num(s) {
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  // Virgül binlik ayırıcıdır, atılır; nokta ondalıktır.
  return Number(s.replace(/,/g, ''));
}
/* Girdi kutusuna yazılacak biçim (num() geri okuyabilir): 100,000 · 76.34 · 1,310.5 */
function fmtIn(v, kind) {
  const d = kind === 'IQD' ? 0 : 2;
  return v > 0 && isFinite(v) ? v.toLocaleString('en-US', { maximumFractionDigits: d }) : '';
}
function solveFx(target, iqd, usd, rate) {
  if (target === 'rate') return iqd > 0 && usd > 0 ? iqd / usd : NaN;
  if (target === 'iqd') return usd > 0 && rate > 0 ? usd * rate : NaN;
  return iqd > 0 && rate > 0 ? iqd / rate : NaN;
}
function touch(order, k) { const i = order.indexOf(k); if (i >= 0) order.splice(i, 1); order.push(k); }
function setRate(date, rate) {
  rate = Math.round(rate * 100) / 100;
  db.rates = db.rates.filter(r => r.date !== date);
  db.rates.push({ id: uid(), date, rate });
}

/* upto verilirse o tarihin sonundaki bakiye (rapor için). */
function balance(id, upto) {
  const a = acc(id); if (!a) return 0;
  let b = Number(a.opening) || 0;
  for (const t of db.tx) {
    if (upto && t.date > upto) continue;
    if (t.accountId === id) {
      if (t.type === 'income' || t.type === 'opening' || t.type === 'debt-in') b += t.amount;
      else if (t.type === 'expense' || t.type === 'debt-out') b -= t.amount;
      else if (t.type === 'transfer') b -= t.amount + (t.feeTo ? 0 : t.fee || 0);
    }
    if (t.type === 'transfer' && t.toAccountId === id) b += t.toAmount - (t.feeTo ? t.fee || 0 : 0);
  }
  return b;
}
/* Harcama sayılan kısım: gider tutarı veya transfer ücreti. Para birimi txCur: çıkan hesabınki; ücret alan taraftan
   kesildiyse (feeTo) hedef hesabınki. Bu durumda toAmount çevrilen (ücretten önceki) tutardır, hedefe toAmount − ücret girer. */
const txCost = t => t.type === 'expense' ? t.amount : t.type === 'transfer' ? (t.fee || 0) : 0;
const txCur = t => { const a = acc(t.type === 'transfer' && t.feeTo ? t.toAccountId : t.accountId) || acc(t.accountId); return a ? a.currency : ''; };
const FEE = '__fee';
/* Transfer ücretlerinin sayıldığı gider kategorisi (Ayarlar); seçilmemişse ayrı "Transfer ücretleri" kalemi. */
const feeCat = () => { const c = cat(db.settings.feeCat); return c && c.type === 'expense' ? c.id : ''; };

/* ---------- dönemler ---------- */
const MONTH = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' });
const MSHORT = new Intl.DateTimeFormat('tr-TR', { month: 'short' });
const DAYFMT = new Intl.DateTimeFormat('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function range(kind, anchor) {
  const d = parse(anchor);
  if (kind === 'week') {
    const off = (d.getDay() - db.settings.weekStart + 7) % 7;
    const s = addDays(d, -off), e = addDays(s, 6);
    const lbl = s.getMonth() === e.getMonth()
      ? `${s.getDate()} – ${e.getDate()} ${MSHORT.format(e)} ${e.getFullYear()}`
      : `${s.getDate()} ${MSHORT.format(s)} – ${e.getDate()} ${MSHORT.format(e)} ${e.getFullYear()}`;
    return { start: ymd(s), end: ymd(e), label: lbl, short: `${s.getDate()} ${MSHORT.format(s)}` };
  }
  if (kind === 'year') {
    const y = d.getFullYear();
    return { start: `${y}-01-01`, end: `${y}-12-31`, label: String(y), short: String(y) };
  }
  const s = new Date(d.getFullYear(), d.getMonth(), 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const lbl = MONTH.format(s);
  return { start: ymd(s), end: ymd(e), label: lbl[0].toUpperCase() + lbl.slice(1), short: MSHORT.format(s) };
}
function shift(kind, anchor, n) {
  const d = parse(anchor);
  if (kind === 'year') return ymd(new Date(d.getFullYear() + n, 0, 1));
  return kind === 'week' ? ymd(addDays(d, 7 * n)) : ymd(new Date(d.getFullYear(), d.getMonth() + n, 1));
}
/* Günlük ortalama için gün sayısı: dönemin içinde, ilk işlem gününden (uygulamayı kullanmaya başladığın gün) bugüne kadar. */
function avgDays(rg) {
  let first = '';
  for (const t of db.tx) if (!first || t.date < first) first = t.date;
  const s = first > rg.start ? first : rg.start, e = today() < rg.end ? today() : rg.end;
  return first && s <= e ? daysBetween(s, e) + 1 : 0;
}
function stats(start, end) {
  const D = disp(); let exp = 0, inc = 0; const byCat = {}, byTop = {}; const native = { IQD: 0, USD: 0 };
  for (const t of db.tx) {
    if (t.date < start || t.date > end) continue;
    const a = acc(t.accountId); if (!a) continue;
    const cost = t.type === 'income' ? t.amount : txCost(t);
    if (!cost) continue;
    const cc = t.type === 'income' ? a.currency : txCur(t), v = conv(cost, cc, D, rateAt(t.date));
    if (t.type !== 'income') {
      exp += v; native[cc] += cost;
      const k = t.type === 'transfer' ? feeCat() || FEE : t.categoryId && cat(t.categoryId) ? t.categoryId : '';
      const top = k && k !== FEE ? topOf(k) : k;
      byCat[k] = (byCat[k] || 0) + v;
      byTop[top] = (byTop[top] || 0) + v;
    } else inc += v;
  }
  return { exp, inc, byCat, byTop, native };
}

/* ---------- görünümler ---------- */
function vOzet() {
  const D = disp(), r = nowRate();
  const accTotal = db.accounts.reduce((s, a) => s + conv(balance(a.id), a.currency, D, r), 0);
  // Net servet: hesaplar + alacaklar − borçlar. Borç verilen para hâlâ sizindir, harcanmış sayılmaz.
  const dt = debtTotals(), total = accTotal + dt.lent - dt.owed, hasDebt = dt.lent || dt.owed;
  const rg = range(ui.period, ui.anchor);
  const st = stats(rg.start, rg.end);
  const t = today();
  const days = avgDays(rg), avg = days ? st.exp / days : 0;

  const cats = Object.entries(st.byTop).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const barRow = (id, name, v, col, sub) => `<div class="bar-row ${sub ? 'sub' : ''}" data-action="drill" data-cat="${esc(id)}" title="İşlemleri gör">
      <div class="bar-lbl">${sub ? '<span class="dot" style="background:transparent"></span>' : `<span class="dot" style="background:${col}"></span>`}${esc(name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, v / max * 100)}%;background:${col}"></div></div>
      <div class="bar-val num">${fmt(v, D)}<small>${Math.round(v / st.exp * 100)}%</small></div></div>`;
  const bars = cats.map(([id, v]) => {
    const c = cat(id), col = c ? c.color : id === FEE ? '#64748b' : '#999';
    let html = barRow(id, c ? c.name : id === FEE ? 'Transfer ücretleri' : 'Kategorisiz', v, col, false);
    const subs = id && id !== FEE ? children(id).map(s => [s.id, s.name, catSum(st.byCat, s.id), s.color]).filter(s => s[2]) : [];
    if (subs.length) {
      if (st.byCat[id]) subs.push([id, `${c.name} (genel)`, st.byCat[id], col]);
      html += subs.sort((a, b) => b[2] - a[2]).map(([sid, n, sv, sc]) => barRow(sid, n, sv, sc, true)).join('');
    }
    return html;
  }).join('');

  const N = ui.period === 'week' ? 8 : 6, cols = [];
  if (ui.period === 'year') {
    // Yıllık görünümde grafik o yılın 12 ayını gösterir.
    for (let m = 0; m < 12; m++) {
      const g = range('month', ymd(new Date(parse(rg.start).getFullYear(), m, 1)));
      cols.push({ label: g.short, full: g.label, v: stats(g.start, g.end).exp, cur: t >= g.start && t <= g.end });
    }
  } else for (let i = N - 1; i >= 0; i--) {
    const g = range(ui.period, shift(ui.period, ui.anchor, -i));
    cols.push({ label: g.short, full: g.label, v: stats(g.start, g.end).exp, cur: i === 0 });
  }
  const tmax = Math.max(...cols.map(c => c.v), 1);
  const compact = v => D === 'USD' ? '$' + fmtNum(v) : (v >= 1e6 ? fmtNum(v / 1e6, 1) + 'M' : v >= 1e3 ? fmtNum(v / 1e3) + 'K' : fmtNum(v));
  const trend = cols.map(c => `<div class="tcol ${c.cur ? 'cur' : ''}" title="${esc(c.full)}: ${fmt(c.v, D)}">
      <div class="tv num">${c.v ? compact(c.v) : ''}</div>
      <div class="tbar" style="height:${c.v / tmax * 100}%"></div>
      <div class="tl">${esc(c.label)}</div></div>`).join('');

  const nativeLine = (st.native.IQD || st.native.USD)
    ? `<div class="muted" style="margin-top:10px;font-size:13px">Hesap para birimine göre harcanan: ${[st.native.IQD && fmt(st.native.IQD, 'IQD'), st.native.USD && fmt(st.native.USD, 'USD')].filter(Boolean).map(x => `<b class="num">${x}</b>`).join(' + ')}</div>` : '';

  const warn = backupStale() ? `<div class="card warn">
    <div class="m"><b>Yedek almayı unutmayın</b><small class="muted">${backupAge() === null
      ? 'Veriler sadece bu cihazda. Cihaz verisi silinirse işlemleriniz kaybolur.'
      : `En son ${backupAge()} gün önce yedeklediniz.`}</small></div>
    <button class="btn primary" data-action="export">Yedekle</button>
    <button class="btn sm" data-action="tab" data-tab="ayarlar">Ayarlar</button>
  </div>` : '';

  return warn + remOzet() + `
  <div class="card">
    <div class="muted" style="font-size:13px">Net servet (${D})</div>
    <div class="big num ${total < 0 ? 'exp' : ''}">${fmt(total, D)}</div>
    ${hasDebt ? `<div class="networth tap" data-action="nav" data-tab="borclar"><span class="muted">Hesaplar <b class="num">${fmt(accTotal, D)}</b></span>${dt.lent ? `<span class="muted">Alacak <b class="num inc">+${fmt(dt.lent, D)}</b></span>` : ''}${dt.owed ? `<span class="muted">Borç <b class="num exp">−${fmt(dt.owed, D)}</b></span>` : ''}</div>` : ''}
    <div class="muted" style="font-size:12px;margin-bottom:12px">${esc(nowRateNote())}</div>
    ${db.accounts.length ? `<div class="accs">${accParents().map(a => {
      const b = balance(a.id), kids = accChildren(a.id);
      if (!kids.length) return `<div class="acc tap" data-action="acc-open" data-id="${a.id}"><div class="n"><span>${esc(a.name)}</span><span class="cur">${a.currency}</span></div>
        <div class="v num ${b < 0 ? 'exp' : ''}">${fmt(b, a.currency)}</div></div>`;
      // Grup kartı: toplam + ana hesabın kendi bakiyesi (kullanılıyorsa) + alt hesaplar
      const members = (accUsed(a.id) || Number(a.opening) ? [a] : []).concat(kids);
      const tot = [a, ...kids].reduce((s, x) => s + conv(balance(x.id), x.currency, D, r), 0);
      return `<div class="acc group tap" data-action="acc-open" data-id="${a.id}"><div class="n"><span>${esc(a.name)}</span><span class="cur">≈ ${D}</span></div>

        <div class="sublines">${members.map(x => {

        }).join('')}</div></div>`;
    }).join('')}</div>` : `<div class="empty">Henüz hesap yok. <button class="btn sm" data-action="tab" data-tab="hesaplar">Hesap ekle</button></div>`}
  </div>

  <div class="card">
    <div class="periodbar">
      <div class="seg">
        <button data-action="period" data-p="week" class="${ui.period === 'week' ? 'on' : ''}">Haftalık</button>
        <button data-action="period" data-p="month" class="${ui.period === 'month' ? 'on' : ''}">Aylık</button>
        <button data-action="period" data-p="year" class="${ui.period === 'year' ? 'on' : ''}">Yıllık</button>
      </div>
      <div class="pnav">
        <button class="icon" data-action="shift" data-n="-1" aria-label="Önceki">‹</button>
        <span class="lbl">${esc(rg.label)}</span>
        <button class="icon" data-action="shift" data-n="1" aria-label="Sonraki">›</button>
        <button class="btn sm" data-action="now">Bugün</button>
      </div>
      <button class="btn sm" data-action="report" title="Bu ${ui.period === 'week' ? 'haftanın' : ui.period === 'year' ? 'yılın' : 'ayın'} raporunu PDF olarak kaydet">📄 PDF rapor</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Harcama</div><div class="v num exp">${fmt(st.exp, D)}</div></div>
      <div class="kpi"><div class="l">Gelir</div><div class="v num inc">${fmt(st.inc, D)}</div></div>
      <div class="kpi"><div class="l">Net</div><div class="v num ${st.inc - st.exp < 0 ? 'exp' : 'inc'}">${fmt(st.inc - st.exp, D, true)}</div></div>
      <div class="kpi"><div class="l">Günlük ortalama harcama</div><div class="v num">${fmt(avg, D)}</div></div>
    </div>
    ${nativeLine}
    <h3>Kategoriye göre harcama</h3>
    ${bars || '<div class="empty">Bu dönemde harcama yok.</div>'}
    <h3>${ui.period === 'year' ? `${esc(rg.label)} — aylara göre harcama` : `Son ${N} ${ui.period === 'week' ? 'hafta' : 'ay'} — harcama`}</h3>
    <div class="trend">${trend}</div>
  </div>`;
}

/* ---------- rapor (PDF) ---------- */
/* Rapor, tarayıcının yazdırma ekranıyla PDF'e dönüşür.
   iPhone'da: Yazdır ekranında Paylaş simgesi → Dosyalar'a Kaydet; bilgisayarda: Hedef → PDF olarak kaydet. */
function reportHtml(kind, anchor) {
  const D = disp(), rg = range(kind, anchor), st = stats(rg.start, rg.end);
  const prg = range(kind, shift(kind, anchor, -1)), ps = stats(prg.start, prg.end);
  const t = today(), word = kind === 'week' ? 'hafta' : kind === 'year' ? 'yıl' : 'ay';
  const days = avgDays(rg), avg = days ? st.exp / days : 0;
  // Önceki döneme göre değişim; harcamada artış kötü (kırmızı), gelirde iyi.
  const chg = (v, p, good) => {
    if (!p) return '<span class="muted">—</span>';
    const pct = Math.round((v - p) / p * 100);
    const cls = pct === 0 ? 'muted' : (pct > 0) === good ? 'inc' : 'exp';
    return `<span class="${cls}">${pct > 0 ? '+' : pct < 0 ? '−' : ''}${Math.abs(pct)}%</span>`;
  };
  const catName = id => { const c = cat(id); return c ? c.name : id === FEE ? 'Transfer ücretleri' : 'Kategorisiz'; };
  const catRows = Object.entries(st.byTop).sort((a, b) => b[1] - a[1]).map(([id, v]) => {
    const c = cat(id), col = c ? c.color : id === FEE ? '#64748b' : '#999';
    let html = `<tr><td><span class="dot" style="background:${col}"></span>${esc(catName(id))}</td>
      <td class="num r">${fmt(v, D)}</td><td class="num r">${Math.round(v / st.exp * 100)}%</td>
      <td class="num r">${fmt(ps.byTop[id] || 0, D)}</td><td class="num r">${chg(v, ps.byTop[id], false)}</td></tr>`;
    if (id && id !== FEE) {
      const subs = children(id).map(x => [x.name, catSum(st.byCat, x.id)]).filter(x => x[1]);
      if (subs.length && st.byCat[id]) subs.push([`${c.name} (genel)`, st.byCat[id]]);
      html += subs.sort((a, b) => b[1] - a[1]).map(([n, sv]) => `<tr class="sub"><td>↳ ${esc(n)}</td>
        <td class="num r">${fmt(sv, D)}</td><td class="num r">${Math.round(sv / st.exp * 100)}%</td><td></td><td></td></tr>`).join('');
    }
    return html;
  }).join('');

  const txs = db.tx.filter(x => x.date >= rg.start && x.date <= rg.end)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0));
  const big = txs.filter(x => x.type === 'expense' && acc(x.accountId))
    .map(x => [x, conv(x.amount, acc(x.accountId).currency, D, rateAt(x.date))])
    .sort((a, b) => b[1] - a[1]).slice(0, kind === 'year' ? 10 : 5);
  const txTable = list => `<table><tr><th>Tarih</th><th>İşlem</th><th class="r">Tutar</th></tr>${list.map(x => {
    const i = txInfo(x);
    return `<tr><td class="nw">${esc(SHORTDATE.format(parse(x.date)))}</td><td><b>${esc(i.title)}</b><br><small class="muted">${esc(i.sub)}</small></td><td class="num r">${i.amt}</td></tr>`;
  }).join('')}</table>`;

  const endBal = rg.end < t ? rg.end : t;
  const accRows = accOrdered().map(a => {
    const b = balance(a.id, endBal);
    return `<tr><td>${esc(accLabel(a))}</td><td class="num r ${b < 0 ? 'exp' : ''}">${fmt(b, a.currency)}</td></tr>`;
  }).join('');
  const total = db.accounts.reduce((s, a) => s + conv(balance(a.id, endBal), a.currency, D, rateAt(endBal)), 0);
  const debts = db.debts.filter(debtOpen), dt = debtTotals(), nr = nowRate();
  const nowAcc = db.accounts.reduce((s, a) => s + conv(balance(a.id), a.currency, D, nr), 0);
  // Yıllık raporda tüm işlemler yerine aylara göre özet.
  const months = kind === 'year' ? Array.from({ length: 12 }, (_, m) => {
    const g = range('month', `${rg.start.slice(0, 4)}-${pad(m + 1)}-01`), x = stats(g.start, g.end);
    return `<tr><td>${esc(g.label)}</td><td class="num r exp">${fmt(x.exp, D)}</td><td class="num r inc">${fmt(x.inc, D)}</td><td class="num r ${x.inc - x.exp < 0 ? 'exp' : 'inc'}">${fmt(x.inc - x.exp, D, true)}</td></tr>`;
  }).join('') : '';

  return `
  <div class="rp-head">
    <div><div class="muted">Kişisel Hesap · ${kind === 'week' ? 'Haftalık' : kind === 'year' ? 'Yıllık' : 'Aylık'} rapor</div><h1>${esc(rg.label)}</h1></div>
    <div class="muted r" style="font-size:12px">Hazırlanma: ${esc(fmtTs(Date.now()))}<br>Tutarlar: ${D} · 1 $ = ${fmtNum(rateAt(endBal))} IQD</div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Harcama</div><div class="v num exp">${fmt(st.exp, D)}</div><small>Önceki ${word}: ${fmt(ps.exp, D)} · ${chg(st.exp, ps.exp, false)}</small></div>
    <div class="kpi"><div class="l">Gelir</div><div class="v num inc">${fmt(st.inc, D)}</div><small>Önceki ${word}: ${fmt(ps.inc, D)} · ${chg(st.inc, ps.inc, true)}</small></div>
    <div class="kpi"><div class="l">Net</div><div class="v num ${st.inc - st.exp < 0 ? 'exp' : 'inc'}">${fmt(st.inc - st.exp, D, true)}</div><small>Önceki ${word}: ${fmt(ps.inc - ps.exp, D, true)}</small></div>
    <div class="kpi"><div class="l">Günlük ortalama harcama</div><div class="v num">${fmt(avg, D)}</div><small>${days} gün</small></div>
  </div>
  ${months ? `<h3>Aylara göre</h3><table><tr><th>Ay</th><th class="r">Harcama</th><th class="r">Gelir</th><th class="r">Net</th></tr>${months}</table>` : ''}
  <h3>Kategoriye göre harcama</h3>
  ${catRows ? `<table><tr><th>Kategori</th><th class="r">Tutar</th><th class="r">Pay</th><th class="r">Önceki ${word}</th><th class="r">Değişim</th></tr>${catRows}</table>` : '<p class="muted">Bu dönemde harcama yok.</p>'}
  ${big.length ? `<h3>En büyük ${big.length} harcama</h3>${txTable(big.map(([x]) => x))}` : ''}
  <h3>Hesap bakiyeleri (${esc(SHORTDATE.format(parse(endBal)))})</h3>
  <table>${accRows}<tr class="tot"><td>Hesaplar toplamı</td><td class="num r">${fmt(total, D)}</td></tr></table>
  ${debts.length ? `<h3>Açık borç / alacak (bugün)</h3>
  <table><tr><th>Kişi</th><th>Tür</th><th class="r">Kalan</th></tr>${debts.map(x => `<tr><td>${esc(x.person)}</td><td>${x.dir === 'lent' ? 'Alacağım' : 'Borcum'}</td><td class="num r ${x.dir === 'lent' ? 'inc' : 'exp'}">${fmt(debtLeft(x), x.currency)}</td></tr>`).join('')}
  <tr class="tot"><td colspan="2">Net (alacak − borç)</td><td class="num r">${fmt(dt.lent - dt.owed, D, true)}</td></tr></table>` : ''}
  <h3>Net servet (bugün)</h3>
  <table><tr><td>Hesaplar</td><td class="num r">${fmt(nowAcc, D)}</td></tr>
  <tr><td>Alacaklar</td><td class="num r inc">+${fmt(dt.lent, D)}</td></tr><tr><td>Borçlar</td><td class="num r exp">−${fmt(dt.owed, D)}</td></tr>
  <tr class="tot"><td>Net servet <small class="muted">(${esc(nowRateNote())})</small></td><td class="num r">${fmt(nowAcc + dt.lent - dt.owed, D)}</td></tr></table>
  ${kind === 'year' ? '' : `<h3>Tüm işlemler (${txs.length})</h3>
  ${txs.length ? txTable(txs) : '<p class="muted">Bu dönemde işlem yok.</p>'}`}`;
}
async function printReport() {
  const rg = range(ui.period, ui.anchor), title = document.title;
  if (NATIVE) {
    // iPhone uygulamasında window.print() hiçbir şey yapmıyor; PDF'i yerel eklenti oluşturup paylaşım menüsünü açar.
    $('#report').innerHTML = reportHtml(ui.period, ui.anchor);
    document.body.classList.add('printing');
    try { await Capacitor.nativePromise('Imza', 'pdf', { ad: `Hesap raporu - ${rg.label}` }); }
    catch (e) { toast('PDF oluşturulamadı: ' + String(e.message || e)); }
    document.body.classList.remove('printing');
    return;
  }
  if (typeof window.print !== 'function') { toast('Bu cihazda yazdırma/PDF desteklenmiyor.'); return; }
  $('#report').innerHTML = reportHtml(ui.period, ui.anchor);
  document.body.classList.add('printing');
  // Bilgisayarda PDF dosyasının adı sayfa başlığından gelir.
  document.title = `Hesap raporu - ${rg.label}`;
  addEventListener('afterprint', () => { document.title = title; document.body.classList.remove('printing'); }, { once: true });
  window.print();
}

function vTx() {
  const f = ui.f;
  const accOpts = accOptions(accOrdered(), f.acc);
  return `
  <div class="card">
    <div class="filters">
      <input data-filter="q" placeholder="Notta ara…" value="${esc(f.q)}" style="grid-column:1/-1" class="q">
      <select data-filter="acc"><option value="">Tüm hesaplar</option>${accOpts}</select>
      <button type="button" class="cpick-btn fpick-btn" data-action="fpick" id="fpickBtn"></button>
      <div id="fpick" class="cpick hide" style="grid-column:1/-1;margin-top:0"></div>
      <input type="date" data-filter="from" value="${f.from}" title="Başlangıç">
      <input type="date" data-filter="to" value="${f.to}" title="Bitiş">
      <button class="btn" data-action="clear-f">Temizle</button>
    </div>
    <div id="txlist"></div>
  </div>`;
}
function renderTxList() {
  const el = $('#txlist'); if (!el) return;
  const f = ui.f, q = f.q.trim().toLocaleLowerCase('tr');
  const D = disp();
  const rows = db.tx.filter(t => {
    // Ana hesap seçiliyse alt hesaplarının (kartlarının) işlemleri de gelir.
    const inAcc = id => id && (id === f.acc || acc(id)?.parentId === f.acc);
    if (f.acc && !inAcc(t.accountId) && !inAcc(t.toAccountId)) return false;
    if (f.cat === '__transfer' && t.type !== 'transfer') return false;
    if (f.cat === '__debt' && t.type !== 'debt-in' && t.type !== 'debt-out') return false;
    if (f.cat === '__opening' && t.type !== 'opening') return false;
    // Ana kategori seçiliyse alt kategorilerinin işlemleri de gelir.
    const fc = t.type === 'transfer' && t.fee > 0 ? feeCat() : '';
    if (f.cat && !['__transfer','__debt','__opening'].includes(f.cat) && !catUnder(t.categoryId, f.cat) && !(fc && catUnder(fc, f.cat))) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (q) {
      const c = cat(t.categoryId);
      const hay = `${t.note || ''} ${t.person || ''} ${catLabel(c)} ${accLabel(acc(t.accountId))} ${t.toAccountId ? accLabel(acc(t.toAccountId)) : ''}`.toLocaleLowerCase('tr');
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));

  let exp = 0, inc = 0;
  for (const t of rows) {
    const a = acc(t.accountId); if (!a) continue;
    if (t.type === 'income') inc += conv(t.amount, a.currency, D, rateAt(t.date));
    else exp += conv(txCost(t), txCur(t), D, rateAt(t.date));
  }
  const active = f.q || f.acc || f.cat || f.from || f.to;
  // Kategori seçiliyse: "Tümü" + alt kategorileri (alt kategorisi yoksa kardeşleri) için çipler, varsa bir üste dönüş.
  const fc = cat(f.cat), top = fc ? (children(fc.id).length ? fc : cat(fc.parentId)) : null, subs = top ? children(top.id) : [];
  const subChip = (id, label) => `<button type="button" class="chip pick ${f.cat === id ? 'sel' : ''}" data-action="fpick-set" data-id="${id}">${esc(label)}</button>`;
  const up = top && cat(top.parentId);
  const subBar = subs.length ? `<div class="chips subchips">${up ? subChip(up.id, `‹ ${up.name}`) : ''}${subChip(top.id, `Tümü · ${top.name}`)}${subs.map(k => subChip(k.id, k.name)).join('')}</div>` : '';
  const summary = subBar + `<div class="chips"><span class="chip">${rows.length} işlem</span>
    <span class="chip">Harcama: <b class="exp num">${fmt(exp, D)}</b></span>
    <span class="chip">Gelir: <b class="inc num">${fmt(inc, D)}</b></span>
    ${active ? '<span class="chip">Filtre açık</span>' : ''}</div>`;

  if (!rows.length) {
    el.innerHTML = summary + `<div class="empty">${db.tx.length ? 'Filtreye uyan işlem yok.' : 'Henüz işlem yok. Sağ alttaki <b>+</b> ile başlayın.'}</div>`;
    return;
  }
  let html = summary, lastDay = '';
  const dayTotals = {};
  for (const t of rows) {
    const a = acc(t.accountId), cost = txCost(t); if (!a || !cost) continue;
    dayTotals[t.date] = (dayTotals[t.date] || 0) + conv(cost, txCur(t), D, rateAt(t.date));
  }
  for (const t of rows) {
    if (t.date !== lastDay) {
      lastDay = t.date;
      html += `<div class="day"><span>${esc(DAYFMT.format(parse(t.date)))}</span>${dayTotals[t.date] ? `<span class="num">−${fmt(dayTotals[t.date], D)}</span>` : ''}</div>`;
    }
    html += txRow(t);
  }
  el.innerHTML = html;
}
/* ---------- hesap ekranı: Özet'teki hesap kartına dokununca ----------
   Bakiye, bu ayki giren/çıkan ve hesabın işlemleri (grup hesapta alt hesaplarla birlikte; çip ile tek alt hesap seçilebilir).
   Tek hesapta her işlemin altında o işlemden sonraki bakiye yazar. */
/* İşlemin bu hesabın bakiyesine etkisi (balance() ile aynı kural). */
function accDelta(t, id) {
  let d = 0;
  if (t.accountId === id) {
    if (t.type === 'income' || t.type === 'opening' || t.type === 'debt-in') d += t.amount;
    else if (t.type === 'expense' || t.type === 'debt-out') d -= t.amount;
    else if (t.type === 'transfer') d -= t.amount + (t.feeTo ? 0 : t.fee || 0);
  }
  if (t.type === 'transfer' && t.toAccountId === id) d += t.toAmount - (t.feeTo ? t.fee || 0 : 0);
  return d;
}
function vHesap() {
  const a = acc(ui.accId);
  if (!a) return '<div class="card"><div class="empty">Hesap bulunamadı.</div></div>';
  const kids = accChildren(a.id), all = [a, ...kids];
  const sel = all.find(x => x.id === ui.accSel) || null;
  const ids = sel ? [sel.id] : all.map(x => x.id);
  const curs = new Set(ids.map(id => acc(id).currency)), one = curs.size === 1, C = one ? [...curs][0] : disp(), r = nowRate();
  const val = (t, id) => conv(accDelta(t, id), acc(id).currency, C, one ? 1 : rateAt(t.date));
  const delta = t => ids.reduce((s, id) => s + val(t, id), 0);
  const bal = ids.reduce((s, id) => s + conv(balance(id), acc(id).currency, C, one ? 1 : r), 0);
  const txs = db.tx.filter(t => ids.includes(t.accountId) || (t.type === 'transfer' && ids.includes(t.toAccountId)))
    .sort((x, y) => x.date.localeCompare(y.date) || (x.ts || 0) - (y.ts || 0));
  // Sonraki bakiye: açılış bakiyesinden başlayıp eskiden yeniye toplanır.
  const after = {};
  let run = ids.reduce((s, id) => s + conv(Number(acc(id).opening) || 0, acc(id).currency, C, one ? 1 : r), 0);
  for (const t of txs) { run += delta(t); after[t.id] = run; }
  const m = range('month', today());
  let inn = 0, out = 0;
  for (const t of txs) if (t.date >= m.start && t.date <= m.end) { const d = delta(t); if (d > 0) inn += d; else out -= d; }
  const list = txs.slice().reverse(), shown = list.slice(0, ui.accMore ? list.length : 60);
  const chip = (x, label) => `<button class="chip pick ${(ui.accSel || '') === (x ? x.id : '') ? 'sel' : ''}" data-action="acc-sel" data-id="${x ? x.id : ''}">${esc(label)}</button>`;
  let rows = '', last = '';
  for (const t of shown) {
    if (t.date !== last) { last = t.date; rows += `<div class="day"><span>${esc(DAYFMT.format(parse(t.date)))}</span></div>`; }
    const { title, sub, col, ic, locked } = txInfo(t), d = delta(t);
    const amt = Math.abs(d) < (C === 'USD' ? 0.005 : 0.5) ? `<span class="num muted">⇄ ${fmt(t.amount, acc(t.accountId)?.currency || C)}</span>`
      : `<span class="num ${d < 0 ? 'exp' : 'inc'}">${d < 0 ? '−' : '+'}${fmt(Math.abs(d), C)}</span>`;
    const row = `<div class="tx" ${locked ? '' : `data-action="edit-tx" data-id="${t.id}"`}>
      <div class="ic" style="background:${col}">${ic}</div>
      <div class="m"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></div>
      <div class="a">${amt}<br><small class="muted num">${one ? fmt(after[t.id], C) : ''}</small></div></div>`;
    rows += locked ? row : swRow(row, swBtn('Sil', 'del-tx', t.id));
  }
  return `<div class="card">
    <div class="krow"><div style="flex:1;min-width:0"><div class="muted" style="font-size:13px">${sel && sel !== a ? `${esc(a.name)} › ${esc(sel.name)}` : 'Bakiye'}${one ? '' : ` (≈ ${C})`}</div>
      <div class="big num ${bal < 0 ? 'exp' : ''}">${fmt(bal, C)}</div></div>
      <button class="btn sm" data-action="edit-acc" data-id="${(sel || a).id}">Düzenle</button></div>
    ${kids.length ? `<div class="chips">${chip(null, 'Tümü')}${chip(a, 'Ana hesap')}${kids.map(k => chip(k, k.name)).join('')}</div>` : ''}
    <div class="kpis">
      <div class="kpi"><div class="l">Bu ay giren</div><div class="v num inc">${fmt(inn, C)}</div></div>
      <div class="kpi"><div class="l">Bu ay çıkan</div><div class="v num exp">${fmt(out, C)}</div></div>
    </div>
    <div class="kbtns">
      <button class="btn" data-action="acc-tx" data-type="expense">− Gider</button>
      <button class="btn" data-action="acc-tx" data-type="income">+ Gelir</button>
      <button class="btn" data-action="acc-tx" data-type="transfer">⇄ Transfer</button>
    </div>
  </div>

/* Mesajdaki dolar kurlarını bulur. Irak'ta kur çoğunlukla 100 $ için yazılır (146,750 → 1 $ = 1,467.5).
   Binlik ayırıcı virgül, nokta veya boşluk olabilir; Arapça/Farsça rakamlar çevrilir.
   Mantıklı aralıktaki her sayı aday olur; dolar geçen satırlar öne alınır, kullanıcı doğrusunu seçer. */
const RATE_MIN = 900, RATE_MAX = 3000;
function readRates(text) {
  const s = String(text || '')
    .replace(/[٠-٩]/g, c => c.charCodeAt(0) - 0x660)
    .replace(/[۰-۹]/g, c => c.charCodeAt(0) - 0x6F0)
    .replace(/٬/g, ',').replace(/٫/g, '.');
  const found = [], seen = new Set();
  const clean = x => x.replace(/[=:$|\-–—]+/g, ' ').replace(/\s+/g, ' ').trim();
  // Bazı mesajlarda şehir adı bir satırda, rakam alt satırda ("بغداد" ↵ "162,700"): etiketsiz rakam üst satırın yazısını alır.
  let ctx = '';
  for (const line of s.split(/\n+/)) {
    const usd = /\$|dolar|dollar|usd|دولار|دۆلار/i.test(line);
    let prevEnd = 0;
    for (const m of line.matchAll(/\d{1,3}(?:[.,\s]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?/g)) {
      const tok = m[0], prev = line[m.index - 1], next = line[m.index + tok.length];
      // Tarih parçası (8/10/2026) ve saat değil.
      if (/[\/:-]/.test(prev || '') || /[\/:-]/.test(next || '')) continue;
      // Etiket: önceki sayıdan bu sayıya kadar olan yazı (ör. "بيع", "Erbil"); yoksa sonrası.
      const before = line.slice(prevEnd, m.index), after = line.slice(m.index + tok.length).split(/\d/)[0];
      prevEnd = m.index + tok.length;
      const ways = [Number(tok.replace(/[,\s]/g, '')), Number(tok.replace(/[.\s]/g, '').replace(',', '.'))];
      for (const v of ways) {
        if (!isFinite(v)) continue;
        const per100 = v >= RATE_MIN * 100 && v <= RATE_MAX * 100;
        if (!per100 && !(v >= RATE_MIN && v <= RATE_MAX)) continue;
        const rate = Math.round((per100 ? v / 100 : v) * 100) / 100;
        if (!seen.has(rate)) {
          seen.add(rate);
          // Emoji/işaretten ibaret yazı etiket sayılmaz (ör. "🔴 163,000 بغداد" → "بغداد").
          const lbl = x => { const c = clean(x); return /\p{L}/u.test(c) ? c : ''; };
          const label = (lbl(before) || lbl(after) || ctx).slice(0, 40);
          found.push({ rate, tok: tok.trim(), per100, label, usd });
        }
        break;
      }
    }
    // Harf içeren satır, sonraki etiketsiz rakamların bağlamı olur.
    const words = clean(line.replace(/\d[\d.,\s]*/g, ' '));
    if (/\p{L}/u.test(words)) ctx = words;
  }
  return found.sort((a, b) => b.usd - a.usd);
}
/* İnternetten piyasa kuru: Iraq Dinar Watch, açık Telegram kanallarındaki çarşı kurlarını
   günde bir kez derleyip CSV olarak yayınlar (1 $ için IQD). Her şehrin en yeni kapanış kuru alınır. */
const MKT_URL = 'https://raw.githubusercontent.com/HusseinKh90/Iraq-parallel-exchange-rate/main/data/daily_fx.csv';
const MKT_CITIES = { erbil: 'Erbil', baghdad: 'Bağdat', basra: 'Basra' };
const mkt = { loading: false, at: 0, data: null };
function parseMkt(txt) {
  const lines = txt.trim().split(/\r?\n/), head = lines[0].split(','), out = {};
  // Son 30 güne bakılır; daha eski kur gösterilmez (kaynak güncellenmeyi bırakırsa eski kur çıkmasın).
  for (let i = lines.length - 1; i > 0; i--) {
    const row = lines[i].split(','), v = k => Number(row[head.indexOf(k)]) || 0;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(row[0]) || daysBetween(row[0], today()) > 30) break;
    for (const c in MKT_CITIES) {
      if (out[c]) continue;
      const r = v(c + '_close') || v(c + '_open');
      if (r >= RATE_MIN && r <= RATE_MAX) out[c] = { rate: r, date: row[0] };
    }
  }
  return Object.keys(out).length ? out : null;
}
function loadMkt(force) {
  if (mkt.loading || (!force && mkt.data && Date.now() - mkt.at < 10 * 60e3)) return;
  mkt.loading = true; renderMkt();
  fetch(MKT_URL, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => { const d = parseMkt(txt); if (d) { mkt.data = d; mkt.at = Date.now(); } })
    .catch(() => {})
    .finally(() => { mkt.loading = false; renderMkt(); });
}
function renderMkt() {
  const el = $('#mkt'); if (!el) return;
  if (!mkt.data) {
    el.innerHTML = mkt.loading ? '<p class="hint">Kur alınıyor…</p>'
      : '<p class="hint">Kur alınamadı (internet yok veya kaynak cevap vermedi). <button class="btn sm" data-action="mkt-reload">Tekrar dene</button></p>';
    return;
  }
  const city = mkt.data[db.settings.rateCity] ? db.settings.rateCity : Object.keys(mkt.data)[0];
  const x = mkt.data[city], age = daysBetween(x.date, today());
  const others = Object.keys(mkt.data).filter(c => c !== city)
    .map(c => `${MKT_CITIES[c]} ${fmtNum(mkt.data[c].rate, mkt.data[c].rate % 1 ? 2 : 0)}`).join(' · ');
  el.innerHTML = `<div class="list-row" style="border-top:0;flex-wrap:wrap">
      <select id="mktCity" style="width:auto">${Object.keys(mkt.data).map(c => `<option value="${c}" ${c === city ? 'selected' : ''}>${MKT_CITIES[c]}</option>`).join('')}</select>
      <div class="m"><b class="num">1 $ = ${fmtNum(x.rate, x.rate % 1 ? 2 : 0)} IQD</b>
        <div class="muted" style="font-size:12px">${esc(SHORTDATE.format(parse(x.date)))} kapanışı${age > 1 ? ` · ${age} gün önce` : ''}${others ? ` · ${esc(others)}` : ''}</div></div>
      <button class="btn sm primary" data-action="use-rate" data-rate="${x.rate}">Kaydet</button>
    </div>`;
}

/* Canlı kur: kendi Cloudflare köprümüz Borsa Erbil kanalının son mesajlarını verir; kur, mesajdan okuyucuyla bulunur. */
const live = { loading: false, at: 0, data: null, err: '' };
/* Borsa Erbil kanalı Erbil, Bağdat ve Basra kurlarını karışık sırayla yazar; her şehir için en yeni satır alınır. */
const LIVE_CITIES = { erbil: ['Erbil', /هەولێر|أربيل|اربيل|erbil/i], baghdad: ['Bağdat', /بغداد|بەغدا|baghdad/i], basra: ['Basra', /بصر[ەة]|بەسرە|basra/i] };
function loadLive(force) {
  const url = db.settings.bridge;
  if (!url || live.loading || (!force && live.data && Date.now() - live.at < 60e3)) return;
  live.loading = true; renderLive();
  fetch(url.replace(/\/+$/, '') + '/?ch=Borsa_Erbil', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => {
      if (!Array.isArray(j.posts)) throw new Error(j.error || 'beklenmeyen cevap');
      const posts = [...j.posts].reverse().map(p => ({ at: p.at, rates: readRates(p.text) })), out = {};
      for (const [k, [, re]] of Object.entries(LIVE_CITIES)) {
        for (const p of posts) {
          const x = p.rates.find(y => re.test(y.label));
          if (x) { out[k] = { ...x, at: p.at }; break; }
        }
      }
      if (!Object.keys(out).length) throw new Error('son mesajlarda kur bulunamadı');
      const before = nowRate();
      live.data = out; live.err = ''; live.at = Date.now();
      // Günün kuru kendiliğinden Erbil kuru olur; o gün elle girilmiş bir kur varsa ona dokunulmaz.
      if (out.erbil) {
        const d = today(), old = db.rates.find(r => r.date === d);
        if (!old || (old.auto && old.rate !== out.erbil.rate)) {
          db.rates = db.rates.filter(r => r.date !== d);
          db.rates.push({ id: uid(), date: d, rate: out.erbil.rate, auto: true });
          save();
        }
      }
      live.changed = before !== nowRate();
    })
    .catch(e => { live.err = e.message || 'alınamadı'; })
    .finally(() => {
      live.loading = false; renderLive(); renderGold();
      // Kur değiştiyse bakiyeler/net servet gösteren ekran yenilenir (açık bir panel yoksa).
      if (live.changed && ['ozet', 'hesaplar', 'borclar'].includes(ui.tab) && !document.querySelector('dialog[open]')) render();
      live.changed = false;
    });
}
const ago = at => {
  const min = Math.max(0, Math.round((Date.now() - Date.parse(at)) / 6e4));
  return min < 60 ? `${min} dk önce` : min < 1440 ? `${Math.round(min / 60)} saat önce` : `${Math.round(min / 1440)} gün önce`;
};
function renderLive() {
  const el = $('#live'); if (!el) return;
  if (!live.data) {
    el.innerHTML = live.loading ? '<p class="hint">Son kur alınıyor…</p>'
      : `<p class="hint">Kur alınamadı (${esc(live.err)}), birazdan kendiliğinden tekrar denenecek. <button class="btn sm" data-action="bridge-edit">Köprüyü değiştir</button></p>`;
    return;
  }
  el.innerHTML = Object.entries(LIVE_CITIES).filter(([k]) => live.data[k]).map(([k, [name]]) => {
    const x = live.data[k];
    return `<div class="list-row">
      <div class="m"><b>${name}</b> <span class="muted" style="font-size:12px">· ${ago(x.at)}</span>
        <div class="num" style="font-size:20px;font-weight:700">${fmtNum(x.rate, x.rate % 1 ? 2 : 0)} <small class="muted">IQD</small></div></div>
      <button class="btn sm primary" data-action="use-rate" data-rate="${x.rate}">Kaydet</button>

  }).join('') + (live.err ? `<p class="hint">Yenilenemedi: ${esc(live.err)}</p>` : '');

/* Canlı kur her dakika kendiliğinden yenilenir (tüm ekranlarda; bakiyeler bu kurla hesaplanır); uygulamaya geri dönünce hemen yenilenir. */

/* ---------- altın ---------- */
/* Ons fiyatı gold-api.com'dan (ücretsiz, anahtarsız, CORS açık). Irak'ta altın miskal (5 gr) ile satılır.
   Fiyatlar saf altın değeridir; kuyumcu işçiliği ve kâr payı dahil değildir. */
const OZ = 31.1034768, MISKAL = 5;
const KARATS = [24, 22, 21, 18];
const gold = { loading: false, at: 0, usd: 0, upd: '', err: '', dir: '', src: '' };
function loadGold(force) {
  if (gold.loading || (!force && gold.usd && Date.now() - gold.at < 60e3)) return;
  gold.loading = true; if (!gold.usd) renderGold();
  fetch('https://api.gold-api.com/price/XAU', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => {
      if (!(j.price > 0)) throw new Error('fiyat yok');
      gold.dir = gold.usd && j.price !== gold.usd ? (j.price > gold.usd ? 'up' : 'down') : '';
      gold.usd = j.price; gold.upd = j.updatedAt || new Date().toISOString(); gold.err = ''; gold.at = Date.now(); gold.src = 'gold-api.com';
    })
    .catch(e => { gold.err = e.message || 'alınamadı'; })
    .finally(() => { gold.loading = false; renderGold(); });
}
/* Anlık fiyat: Binance'teki PAXG/USDT işlemleri websocket ile her işlemde gelir (ücretsiz, anahtarsız).
   1 PAXG = 1 ons fiziki altın; fiyatı spot ons fiyatına çok yakındır. Sadece Altın sekmesi açıkken bağlı kalır. */
const WS_HOSTS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];
let ws = null, wsHost = 0, wsFrame = 0;
const goldLive = () => ws && ws.readyState === 1 && Date.now() - gold.at < 30e3;
function goldStream() {
  const want = ui.tab === 'altin' && !document.hidden;
  if (!want) { if (ws) { ws.onclose = null; ws.close(); ws = null; } return; }
  if (ws || typeof WebSocket === 'undefined') return;
  const sock = ws = new WebSocket(WS_HOSTS[wsHost] + '/ws/paxgusdt@aggTrade');
  sock.onmessage = e => {
    const p = parseFloat(JSON.parse(e.data).p);
    if (!(p > 0)) return;
    if (p !== gold.usd) gold.dir = gold.usd ? (p > gold.usd ? 'up' : 'down') : '';
    gold.usd = p; gold.at = Date.now(); gold.upd = new Date().toISOString(); gold.err = ''; gold.src = 'canlı';
    if (!wsFrame) wsFrame = requestAnimationFrame(() => { wsFrame = 0; renderGold(); });
  };
  sock.onerror = () => { wsHost = (wsHost + 1) % WS_HOSTS.length; };
  sock.onclose = () => { if (ws === sock) ws = null; };
}
/* Dinara çevirme: seçilen şehrin (Erbil/Bağdat/Basra) canlı kuru. Canlı kur yoksa kayıtlı kur, açıkça belirtilerek. */

const SHORTDATE = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
const debtPaid = x => x.payments.reduce((s, p) => s + p.amount, 0);
const debtLeft = x => Math.max(0, x.amount - debtPaid(x));

const debtAccounts = cur => accOrdered().filter(a => a.currency === cur);

}

function syncDebtForm() {

let payId = null;

function submitPay(e) {
  e.preventDefault();
  const x = db.debts.find(d => d.id === payId); if (!x) return;
  const f = $('#payForm').elements, amount = num(f.amount.value), a = acc(f.accountId.value);
  if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); return; }
  if (!a) { toast('Bir hesap seçin.'); return; }
  if (!f.date.value) { toast('Tarih seçin.'); return; }
  const fx = a.currency !== x.currency, R = num(f.rate.value);
  if (fx && !(R > 0)) { toast('Geçerli bir kur girin.'); return; }
  const left = debtLeft(x);
  let ded = fx ? conv(amount, a.currency, x.currency, R) : amount;
  // Kur çevirisinde küçük yuvarlama farkı (%0,5'e kadar) kalanı kapatır.
  const tol = fx ? Math.max(0.005, left * 0.005) : 0.005;
  if (ded > left + tol) { toast(`Kalan tutardan (${fmt(left, x.currency)}) fazla olamaz.`); return; }

  const pid = uid(), txid = uid();

  const pay = { id: pid, date: f.date.value, amount: ded, note: f.note.value.trim(), accountId: a.id, txId: txid };
  if (fx) pay.paid = { amount, currency: a.currency, rate: R };

    accountId: a.id, amount, note: f.note.value.trim(), debtId: x.id, paymentId: pid,

}

/* ---------- yedek ---------- */
/* Yedek, uygulamanın tüm verisini tek bir .json dosyasına yazar.
   iPhone ana ekran uygulamasında indirme çalışmadığı için Paylaş menüsü kullanılır
   (Dosyalar'a Kaydet, iCloud Drive, WhatsApp…); masaüstünde normal indirme olur. */
const backupAge = () => db.settings.lastBackup ? daysBetween(db.settings.lastBackup, today()) : null;
const backupStale = () => db.tx.length > 0 && (backupAge() === null || backupAge() >= 7);
function backupLine() {
  const n = backupAge();
  if (n === null) return db.tx.length ? '⚠️ Henüz hiç yedek almadınız.' : 'Henüz yedek alınmadı.';
  if (n <= 0) return '<span class="ok">✓ Bugün yedeklendi.</span>';
  const s = n === 1 ? 'Son yedek: dün.' : `Son yedek: ${n} gün önce.`;
  return backupStale() ? '⚠️ ' + s : `<span class="ok">✓</span> ${s}`;
}
function markBackup() { db.settings.lastBackup = today(); save(); render(); }
function backupFile() {
  const name = `kisisel-hesap-yedek-${today()}.json`;
  return new File([JSON.stringify(db, null, 2)], name, { type: 'application/json' });
}
function downloadBackup(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  markBackup(); toast('Yedek indirildi');
}
async function doBackup() {
  const file = backupFile();
  // canShare/share, tıklama anında çağrılmalı — bu yüzden await'ten önce kontrol edilir.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      // Başlık verilmez: iOS onu ayrıca "text" dosyası olarak kaydediyor.
      await navigator.share({ files: [file] });
      markBackup(); toast('Yedek kaydedildi');
    } catch (err) {
      // Kullanıcı paylaşım menüsünü kapattıysa sessizce vazgeç; başka hatada indirmeyi dene.
      if (!err || err.name !== 'AbortError') downloadBackup(file);
    }
    return;
  }
  downloadBackup(file);
}

    if (drag.kind === 'row') {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }

/* Silinmiş bir hesabın adını (çöp kutusunda duruyorsa) bulur. */
const goneAcc = id => { const x = db.trash.find(y => y.kind === 'acc' && y.data.acc.id === id); return x ? `Önce Silinenler'den "${x.data.acc.name}" hesabını geri alın.` : 'Bu kaydın hesabı artık yok.'; };
const needAcc = ids => { const m = ids.filter(Boolean).find(id => !acc(id)); return m ? goneAcc(m) : ''; };
/* Geri alır; olmazsa nedenini döner. */
function trashRestore(id) {
  const x = db.trash.find(y => y.id === id); if (!x) return 'Kayıt bulunamadı.';
  const d = x.data, has = (list, oid) => list.some(o => o.id === oid);
  if (x.kind === 'tx') {
    const err = needAcc([d.accountId, d.toAccountId]); if (err) return err;
    if (!has(db.tx, d.id)) db.tx.push(d);
  } else if (x.kind === 'acc') {
    if (!has(db.accounts, d.acc.id)) {
      if (d.acc.parentId && !acc(d.acc.parentId)) d.acc.parentId = '';
      db.accounts.push(d.acc);
      if (!d.acc.parentId) (d.kids || []).forEach(k => { const a = acc(k); if (a && !a.parentId && !accChildren(a.id).length) a.parentId = d.acc.id; });
    }
  } else if (x.kind === 'cat') {
    if (!has(db.categories, d.cat.id)) {
      if (d.cat.parentId && !cat(d.cat.parentId)) d.cat.parentId = '';
      db.categories.push(d.cat);
      // Silinirken bir üst seviyeye geçen alt kategoriler, hâlâ oradaysa yerine döner.
      (d.kids || []).forEach(k => { const c = cat(k); if (c && (c.parentId || '') === (d.cat.parentId || '') && !catDesc(c.id).has(d.cat.id)) c.parentId = d.cat.id; });
      (d.txs || []).forEach(tid => { const t = db.tx.find(y => y.id === tid); if (t && !t.categoryId) t.categoryId = d.cat.id; });
    }
  } else if (x.kind === 'debt') {
    const err = needAcc((d.txs || []).map(t => t.accountId)); if (err) return err;

/* Transferin iki ucunu tek satırda özetler: çıkan hesaptan düşen (tutar + ücret) ve hedefe giren. */
function trSummary(a, b, amt, toAmt, fee, feeTo) {
  if (!a || !b || !(amt > 0)) return '';

  if (feeTo) {
    const inTxt = toAmt > 0 ? `+${fmt(toAmt - fee, b.currency)}` : '—';
    return `<b>${esc(accLabel(a))}</b> <span class="exp num">−${fmt(amt, a.currency)}</span>` +
      ` → <b>${esc(accLabel(b))}</b> <span class="inc num">${inTxt}</span>` +
      (fee && toAmt > 0 ? ` <small class="muted">(${fmt(toAmt, b.currency)} − ${fmt(fee, b.currency)} ücret)</small>` : '');
  }
  const feeTxt = fee ? ` <small class="muted">(${fmt(amt, a.currency)} + ${fmt(fee, a.currency)} ücret)</small>` : '';
  const inTxt = toAmt > 0 ? `+${fmt(toAmt, b.currency)}` : '—';
  return `<b>${esc(accLabel(a))}</b> <span class="exp num">−${fmt(amt + fee, a.currency)}</span>${feeTxt}` +

function submitTx(e) {
  e.preventDefault();
  const f = F(), amount = num(f.amount.value);
  if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); f.amount.focus(); return; }
  if (!f.date.value) { toast('Tarih seçin.'); return; }
  const t = {
    id: dlg.id || uid(), ts: dlg.id ? (db.tx.find(x => x.id === dlg.id)?.ts || Date.now()) : Date.now(),
    type: dlg.type, date: f.date.value, accountId: f.accountId.value, amount, note: f.note.value.trim(),
  };
  if (dlg.type === 'transfer') {
    const a = acc(t.accountId), b = acc(f.toAccountId.value);
    if (!b || b.id === a.id) { toast('Farklı bir hedef hesap seçin (önce ikinci bir hesap ekleyin).'); return; }
    t.toAccountId = b.id;
    t.toAmount = a.currency === b.currency ? amount : num(f.toAmount.value);
    if (!(t.toAmount > 0)) { toast('Hedef tutarı veya kuru girin.'); return; }
    t.fee = f.fee.value.trim() ? num(f.fee.value) : 0;
    if (!(t.fee >= 0)) { toast('Transfer ücreti geçersiz.'); f.fee.focus(); return; }
    ui.lastFeeSide = f.feeSide.value;
    if (t.fee > 0 && f.feeSide.value === 'to') {
      if (t.fee >= t.toAmount) { toast('Ücret, çevrilen tutardan küçük olmalı.'); f.fee.focus(); return; }
      t.feeTo = true;
    }
    ui.lastTrAcc = a.id; ui.lastTrTo = b.id;
    if (a.currency !== b.currency && f.saveRate.checked) {
      const R = a.currency === 'IQD' ? amount / t.toAmount : t.toAmount / amount;
      if (Math.abs(R - rateAt(t.date)) >= 0.01) setRate(t.date, R);
    }
  } else if (dlg.type === 'opening') {
    ui.lastOpeningAcc = t.accountId;
  } else {
    t.categoryId = f.categoryId.value;
    const was = dlg.id && db.tx.find(x => x.id === dlg.id);
    if (dlg.type === 'expense' && !t.categoryId && (!was || was.categoryId)) {
      toast('Kategori seçin.'); $('#cpick').classList.remove('hide'); drawCatPick(); return;
    }
    if (dlg.type === 'income') ui.lastIncAcc = t.accountId; else ui.lastExpAcc = t.accountId;
  }
  const i = db.tx.findIndex(x => x.id === t.id);
  if (i >= 0) db.tx[i] = t; else db.tx.push(t);
  save(); closeSheet($('#txDlg')); render();
  toast(i >= 0 ? 'İşlem güncellendi' : 'İşlem eklendi');
}

document.addEventListener('click', e => {

  const d = el.dataset;
  switch (d.action) {
    case 'tab': ui.tab = d.tab; render(); scrollTo(0, 0); onScroll(); break;

    case 'new-cat': ui.editCat = ui.newCatParent = null; catSheet(); break;
    case 'new-debt': openDebtSheet(); break;
    case 'new-rate': rateSheet(); break;
    case 'undo': undo(d.id); break;
    case 'trash-restore': undo(d.id); break;
    case 'trash-del':
      ask({ msg: 'Bu kayıt kalıcı olarak silinsin mi? Bir daha geri alınamaz.', ok: 'Kalıcı sil' }).then(ok => {
        if (ok) { db.trash = db.trash.filter(x => x.id !== d.id); save(); render(); }
      });
      break;
    case 'trash-empty':
      ask({ msg: `Silinenler listesindeki ${db.trash.length} kayıt kalıcı olarak silinsin mi? Bir daha geri alınamaz.`, ok: 'Hepsini kalıcı sil' }).then(ok => {

    case 'period': ui.period = d.p; render(); break;
    case 'shift': ui.anchor = shift(ui.period, ui.anchor, +d.n); render(); break;

    case 'drill': {

      ui.tab = 'islemler'; render(); scrollTo(0, 0); break;
    }
