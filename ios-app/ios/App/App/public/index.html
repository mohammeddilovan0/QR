    case 'new-tx': openTx(d.type); if (ui.tab === 'hesap') accPreset(); break;

      ui.accId = d.id; ui.accSel = d.sel && d.sel !== d.id ? d.sel : ''; ui.accMore = false;
      ui.tab = 'hesap'; render(); scrollTo(0, 0); onScroll(); break;
    case 'acc-sel': ui.accSel = d.id; ui.accMore = false; render(); break;
    case 'acc-more': ui.accMore = true; render(); break;
    case 'acc-tx': openTx(d.type); accPreset(); break;
    case 'edit-tx': openTx(null, d.id); break;
    case 'tx-type': dlg.type = d.type; resetFx(); syncTx(); break;
    case 'fee-side': F().feeSide.value = d.v; syncTx(); break;
    case 'quick-acc': {
      const f = F(), a = acc(f.accountId.value), currency = a && a.currency === 'USD' ? 'IQD' : 'USD';
      const na = { id: uid(), name: currency === 'USD' ? 'Nakit Dolar' : 'Nakit Dinar', currency, opening: 0 };
      db.accounts.push(na); save(); render();

      const a = acc(d.id); if (!a) break;
      const n = db.tx.filter(t => t.accountId === d.id || t.toAccountId === d.id).length, kids = accChildren(d.id);
      if (n) { closeSw(); tell(`"${a.name}" hesabında ${n} işlem var. Önce bu işlemleri silin veya başka hesaba taşıyın.`); break; }
      let msg = `"${a.name}" hesabı silinsin mi?`;

        const tid = trashPut('acc', a.name, `${a.currency}${a.parentId && acc(a.parentId) ? ' · ' + acc(a.parentId).name + ' altında' : ''}`, { acc: a, kids: kids.map(k => k.id) });

    case 'fpick':

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.id === 'txForm') return submitTx(e);
  if (form.id === 'payForm') return submitPay(e);
  e.preventDefault();
  const v = Object.fromEntries(new FormData(form));
  if (form.dataset.form === 'acc') {
    const name = (v.name || '').trim(); if (!name) return;
    const opening = v.opening ? num(v.opening) : 0;
    if (isNaN(opening)) { toast('Açılış bakiyesi geçersiz.'); return; }
    const par = v.parentId ? acc(v.parentId) : null;
    if (ui.editAcc) {
      const a = acc(ui.editAcc);
      a.name = name; a.opening = opening; if (v.currency) a.currency = v.currency;
      // Alt hesabı olan hesap ana hesap kalır (parentId alanı kapalı gelir).
      a.parentId = accChildren(a.id).length || !par || par.id === a.id ? '' : par.id;
      ui.editAcc = null; toast('Hesap güncellendi');
    } else {
      db.accounts.push({ id: uid(), name, currency: v.currency, opening, parentId: par ? par.id : '' });
      toast(par ? `"${par.name}" altına eklendi` : 'Hesap eklendi');
      // Aynı ana hesaba art arda kart eklemeyi kolaylaştırmak için form açık kalır.
    }
  } else if (form.dataset.form === 'cat') {
    const name = (v.name || '').trim(); if (!name) return;
    const par = v.parentId ? cat(v.parentId) : null;
    const type = par ? par.type : (v.type || 'expense');
    if (ui.editCat) {
      const c = cat(ui.editCat), desc = catDesc(c.id);
      const parentId = par && !desc.has(par.id) ? par.id : '';
      if (c.type !== type && db.tx.some(t => desc.has(t.categoryId))) {
        toast('İşlemi olan kategorinin türü (gider/gelir) değiştirilemez.'); return;
      }
      Object.assign(c, { name, type, color: v.color, parentId });
      desc.forEach(k => { const x = cat(k); if (x) x.type = type; });
      if (parentId) catPath(parentId).forEach(x => ui.openCats.add(x.id));
      ui.editCat = null; toast('Kategori güncellendi');
    } else {
      db.categories.push({ id: uid(), name, type, color: v.color, parentId: par ? par.id : '' });
      if (par) catPath(par.id).forEach(x => ui.openCats.add(x.id));
      toast(par ? `"${par.name}" altına eklendi` : 'Kategori eklendi');
      // Aynı ana kategoriye art arda alt kategori eklemeyi kolaylaştırmak için form açık kalır.
    }
  } else if (form.dataset.form === 'rate') {
    if (!v.date) { toast('Tarih seçin.'); return; }
    const rate = num(v.rate);
    if (!(rate > 0)) { toast('Geçerli bir kur girin.'); return; }
    db.rates = db.rates.filter(r => r.date !== v.date);
    db.rates.push({ id: uid(), date: v.date, rate });
    toast('Kur kaydedildi');
  } else if (form.dataset.form === 'debt' && form.dataset.id) {
    const x = db.debts.find(y => y.id === form.dataset.id); if (!x) return;
    const person = (v.person || '').trim(), amount = num(v.amount), note = (v.note || '').trim();
    if (!person) { toast('Kişi adını girin.'); return; }
    if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); return; }
    if (!v.date) { toast('Tarih seçin.'); return; }
    if (amount < debtPaid(x) - 0.005) { toast(`Tutar, ödenmiş kısımdan (${fmt(debtPaid(x), x.currency)}) az olamaz.`); return; }
    Object.assign(x, { person, amount, note, date: v.date });
    // Bağlı hesap hareketleri de güncellenir (bakiye ve isim tutarlı kalsın).
    for (const t of db.tx) {
      if (t.debtId !== x.id) continue;
      t.person = person;
      if (t.id === x.txId) Object.assign(t, { amount, date: v.date, note });
    }
    toast('Kaydedildi');
  } else if (form.dataset.form === 'rem') {
    if (!remSubmit(form, v)) return;
  } else if (form.dataset.form === 'debt') {
    const person = (v.person || '').trim(), amount = num(v.amount), opening = v.entryMode === 'opening';
    const a = opening ? null : acc(v.accountId);
    if (!person) { toast('Kişi adını girin.'); form.elements.person.focus(); return; }
    if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); form.elements.amount.focus(); return; }
    if (!opening && (!a || a.currency !== v.currency)) { toast(`${v.currency} para biriminde bir hesap seçin.`); return; }
    if (!v.date) { toast('Tarih seçin.'); return; }
    const did = uid(), txid = opening ? '' : uid(), note = (v.note || '').trim();
    db.debts.push({
      id: did, dir: v.dir, person, amount, currency: v.currency, accountId: a ? a.id : '', txId: txid,
      date: v.date, note, payments: [], opening,
    });
    if (!opening) {
      db.tx.push({
        id: txid, ts: Date.now(), type: v.dir === 'owed' ? 'debt-in' : 'debt-out', date: v.date,
        accountId: a.id, amount, note, debtId: did, debtKind: v.dir, person, locked: true,
      });
      toast(v.dir === 'lent' ? 'Alacak eklendi · hesaptan düşüldü' : 'Borç eklendi · hesaba girdi');
    } else {
      toast(v.dir === 'lent' ? 'Başlangıç alacağı eklendi' : 'Başlangıç borcu eklendi');
    }
  }
  if (form.closest('#sheet')) closeSheet($('#sheet'));
  save(); render();
});

/* ---------- ayağa kalk hatırlatıcısı ----------
   Ayarlar bu cihaza özeldir (yedeğe girmez). Uygulama açıkken hatırlatmayı uygulama kendisi yapar ve seçilen sesi çalar.
   iPhone'da uygulama kapalıyken zamanlayıcı çalışmadığı için, kapalıyken bildirim köprü (Cloudflare Worker) üzerinden
   Web Push ile gelir; köprü her dakika aynı kuralla (due) zamanı gelmiş mi bakar. */
const KALK = KEY + '-kalk';
/* iPhone uygulaması (ios-app, Capacitor) içinde: hatırlatmalar telefonun yerel bildirimleriyle kurulur ve seçilen ses
   pakette (kalk-*.wav) olduğu için uygulama kapalıyken de o çalar. Köprü/Web Push gerekmez. */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const LN = (m, o) => Capacitor.nativePromise('LocalNotifications', m, o || {});
const KALK_DEF = { on: false, every: 20, start: '09:00', end: '22:00', days: [0, 1, 2, 3, 4, 5, 6], sound: 'zil', pause: 0 };
const KALK_EVERY = [15, 20, 25, 30, 45, 60];
const KALK_DAYS = [[1, 'Pzt'], [2, 'Sal'], [3, 'Çar'], [4, 'Per'], [5, 'Cum'], [6, 'Cmt'], [0, 'Paz']];
const SOUNDS = [['zil', 'Zil'], ['marimba', 'Marimba'], ['kus', 'Kuş cıvıltısı'], ['gong', 'Gong'], ['yumusak', 'Yumuşak'], ['bip', 'Bip bip'], ['yok', 'Sessiz']];
const hm = s => { const m = /^(\d\d):(\d\d)$/.exec(s || ''); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
function loadKalk() {
  let k = {};
  try { k = JSON.parse(localStorage.getItem(KALK)) || {}; } catch (e) {}
  k = Object.assign({}, KALK_DEF, k);
  k.on = !!k.on;
  k.every = +k.every >= 5 && +k.every <= 240 ? Math.round(+k.every) : 20;
  if (hm(k.start) === null) k.start = KALK_DEF.start;
  if (hm(k.end) === null) k.end = KALK_DEF.end;
  k.days = Array.isArray(k.days) ? KALK_DAYS.map(d => d[0]).filter(d => k.days.includes(d)) : KALK_DEF.days.slice();
  if (!SOUNDS.some(s => s[0] === k.sound)) k.sound = 'zil';
  k.pause = +k.pause || 0;
  return k;
}
let K = loadKalk();
const kalkOn = () => K.on;
function saveKalk(sync = true) {
  try { localStorage.setItem(KALK, JSON.stringify(K)); } catch (e) {}
  if (NATIVE) nativeScheduleSoon(); else if (sync) pushSyncSoon();
}
const kalkAyar = () => ({ on: K.on, every: K.every, start: K.start, end: K.end, days: K.days, pause: K.pause, tz: new Date().getTimezoneOffset() });

/* Köprüdeki (kopru/worker.js) due() ile aynı kural: çalışma saatleri içinde başlangıçtan itibaren her "every" dakikada bir,
   başlangıç anında değil (09:00 başlıyorsa ilki 09:20). Bitiş başlangıçtan küçükse aralık gece yarısını aşar. */
function kalkDue(a, ts) {
  if (!a.on || ts < a.pause) return false;
  const local = new Date(ts - a.tz * 60e3);
  const m = local.getUTCHours() * 60 + local.getUTCMinutes();
  const s = hm(a.start), e = hm(a.end);
  const span = ((e - s + 1440) % 1440) || 1440, off = (m - s + 1440) % 1440;
  if (off === 0 || off > span || off % a.every) return false;
  return a.days.includes(new Date(ts - a.tz * 60e3 - off * 60e3).getUTCDay());
}
function kalkNext(from = Date.now()) {
  const a = kalkAyar(), t0 = Math.floor(from / 60e3) * 60e3;
  for (let i = 1; i <= 8 * 1440; i++) if (kalkDue(a, t0 + i * 60e3)) return t0 + i * 60e3;
  return 0;
}
const hhmm = ts => new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
function whenLabel(ts) {
  const d = daysBetween(today(), ymd(new Date(ts)));
  return d === 0 ? hhmm(ts) : d === 1 ? `Yarın ${hhmm(ts)}` : new Date(ts).toLocaleDateString('tr-TR', { weekday: 'long' }) + ' ' + hhmm(ts);
}

/* Sesler: dosya yerine tarayıcıda üretilir (internetsiz de çalışır). iPhone ses çalmak için bir dokunuşla "uyandırılmalı". */
let actx = null;
function audio() {
  const C = window.AudioContext || window.webkitAudioContext;

function remUndo() {

/* Erteleme: tekrarlamayan hatırlatıcının tarihi/saati kayar; tekrarlayanda yalnız bu seferki tekrar (snz). */
function remMove(r, ts) {

  if (minutes) return go(Date.now() + minutes * 60e3);
  const now = new Date(), ev = new Date(now); ev.setHours(20, 0, 0, 0);

/* Çok seçenekli menü (onay menüsünün kardeşi). Seçilen değeri, vazgeçilirse '' döner. */

/* Önümüzdeki uyarılar (her hatırlatıcı için en çok 3 tekrar), en yakından. */
function remAlerts(limit = REM_MAX) {
  const now = Date.now(), out = [];
  for (const r of db.reminders) {
    if (r.done || !r.date) continue;
    let date = r.date;
    for (let k = 0; k < 3 && date; k++) {
      const due = k === 0 && r.snz ? r.snz : remAt(date, r.time), at = k === 0 && r.snz ? r.snz : due - (r.alert || 0) * 60e3;
      if (at > now + 5e3) out.push({ r, date, at, due });
      if (!r.rep) break;
      date = remNextFrom(r, date);
    }
  }
  return out.sort((a, b) => a.at - b.at).slice(0, limit);
}

    ${K.on && next ? `<div class="knext num">${esc(whenLabel(next))}</div>
      <div class="muted" style="font-size:13px">${paused ? 'Ara verildi · sonraki hatırlatma' : 'Sonraki hatırlatma'}</div>
      <div class="kbtns">${paused ? '<button class="btn" data-kalk="resume">Devam et</button>'
        : '<button class="btn" data-kalk="pause" data-min="60">1 saat ara ver</button><button class="btn" data-kalk="pause-day">Bugünlük yeter</button>'}</div>` : ''}
  </div>
  <div class="card">
    <h2>Ne sıklıkla?</h2>
    <div class="chips" style="margin-top:0">${KALK_EVERY.map(m => `<button class="chip pick ${K.every === m ? 'sel' : ''}" data-kalk="every" data-v="${m}">${m} dk</button>`).join('')}</div>
    <h2 style="margin-top:18px">Hangi saatlerde?</h2>
    <div class="ktimes"><label>Başlangıç<input type="time" data-kalk-set="start" value="${K.start}"></label><label>Bitiş<input type="time" data-kalk-set="end" value="${K.end}"></label></div>
    <div class="chips kdays">${KALK_DAYS.map(([d, l]) => `<button class="chip pick ${K.days.includes(d) ? 'sel' : ''}" data-kalk="day" data-v="${d}">${l}</button>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Bu saatlerin dışında (ör. gece) hatırlatma gelmez.</p>
  </div>
  <div class="card" style="padding-top:8px;padding-bottom:6px">
    <h2 style="margin-top:8px">Ses</h2>
    ${SOUNDS.map(([k, l]) => `<button class="snd ${K.sound === k ? 'sel' : ''}" data-kalk="sound" data-v="${k}"><span>${l}</span><span class="ck">✓</span></button>`).join('')}
    <p class="muted" style="font-size:12px;margin:6px 4px 10px">Dokununca dinlersiniz. ${NATIVE ? 'Seçilen ses uygulama kapalıyken de çalar.' : 'Seçilen ses uygulama açıkken çalar. Uygulama kapalıyken iPhone bildirimde kendi sesini çalar; web uygulamalarında bu sesi değiştirmeye iOS izin vermiyor.'}</p>
  </div>
  <div class="card" id="kalkPush">${vPush()}</div>`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-kalk]'); if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.kalk) {
    case 'ban-close': kalkBanClose(); return;
    case 'toggle':
      K.on = !K.on; K.pause = 0; saveKalk(); render();
      if (K.on) { audio(); if (NATIVE) pushEnable(); else if (pushOk() && db.settings.bridge && Notification.permission === 'default') pushEnable(); }
      return;
    case 'every': K.every = +v; break;
    case 'day': { const d = +v; K.days = K.days.includes(d) ? K.days.filter(x => x !== d) : [...K.days, d]; break; }
    case 'sound': K.sound = v; saveKalk(false); playSound(v); render(); return;
    case 'pause': K.pause = Date.now() + (+el.dataset.min) * 60e3; toast('1 saat ara verildi'); break;
    case 'pause-day': { const t = new Date(); t.setHours(24, 0, 0, 0); K.pause = t.getTime(); toast('Yarına kadar hatırlatma yok'); break; }
    case 'resume': K.pause = 0; break;
    case 'push-on': pushEnable(); return;
    case 'check': kalkCheck(true); return;
    case 'test':
      if (NATIVE) {
        LN('schedule', { notifications: [{ id: 999, ...natBase(), schedule: { at: new Date(Date.now() + 5e3) } }] })
          .then(() => toast('5 saniye sonra gelir, istersen uygulamayı kapat')).catch(e => toast('Kurulamadı: ' + e.message));
        return;
      }
      el.disabled = true;
      bridgeCall('test', { endpoint: kalkPush.ep }).then(() => toast('Gönderildi, birkaç saniye içinde gelir'))
        .catch(e => toast('Gönderilemedi: ' + e.message)).finally(() => { el.disabled = false; });
      return;
    default: return;
  }
  saveKalk(); render();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.kalkSet;
  if (!k || hm(e.target.value) === null) return;
  K[k] = e.target.value; saveKalk(); render();
});
// Açılışta: köprüdeki ayarlar güncel kalsın (saat dilimi, iPhone'un yenilediği abonelik).
if (K.on) pushSyncSoon();

render();
if (db.settings.bridge) loadLive();

// İnternet sitesinden açıldığında internetsiz de çalışsın (bilgisayarda dosyadan açınca devre dışı).
if ('serviceWorker' in navigator && !NATIVE && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  // Yeni sürüm devreye girince sayfayı bir kez yenile ki eski kod açık kalmasın.
  const hadCtrl = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadCtrl && !reloaded) { reloaded = true; location.reload(); }
  });
}
// Tarayıcıdan verilerin kendiliğinden silinmemesini iste.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
