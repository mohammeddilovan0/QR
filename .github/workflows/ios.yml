name: iOS uygulaması
# iPhone uygulamasını (ios-app) imzasız .ipa olarak derler. SideStore kurarken kendi Apple ID'nizle imzalar.
# main'e her gönderimde .ipa şu adreste güncellenir:
# https://github.com/mohammeddilovan0/QR/releases/download/ios/KisiselHesap.ipa
on:
  pull_request:
    paths: ['ios-app/**', 'index.html', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios-app/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Web uygulamasının güncel hâlini pakete koy
        run: cp index.html manifest.webmanifest icon-180.png icon-192.png icon-512.png ios-app/ios/App/App/public/
      - name: Derle (imzasız, iPhone)
        working-directory: ios-app/ios/App
        shell: bash -o pipefail {0}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "(error|warning: .*unavailable):" build.log | sort -u | head -40; tail -30 build.log; exit 1; }
          tail -5 build.log
      - name: .ipa oluştur
        run: |
          mkdir Payload
          cp -R ios-app/ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          test -d Payload/App.app/PlugIns/ImzaWidget.appex || { echo 'widget uzantısı pakette yok'; exit 1; }
          zip -qry KisiselHesap.ipa Payload
          ls -la KisiselHesap.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: KisiselHesap-ipa
          path: KisiselHesap.ipa
      - name: İndirme bağlantısını güncelle
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios -y --cleanup-tag || true
          gh release create ios KisiselHesap.ipa --target "$GITHUB_SHA" --title "iPhone uygulaması" --latest=false \
            --notes "SideStore ile yükleyin: Safari'de bu dosyayı indirin, SideStore → My Apps → + ile seçin."
