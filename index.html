<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kişisel Hesap</title>
<!-- iPhone ana ekran uygulaması -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hesap">
<meta name="theme-color" content="#1f6f5c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1c1c1a;--muted:#6d6b65;--line:#e3e1da;--soft:#efede7;
  --accent:#1f6f5c;--accent-ink:#ffffff;--exp:#b4432f;--inc:#1f7a4a;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9d9b94;--line:#33322e;--soft:#282725;
    --accent:#4fb596;--accent-ink:#0c1f19;--exp:#ec8069;--inc:#5fc78d;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9d9b94;--line:#33322e;--soft:#282725;
  --accent:#4fb596;--accent-ink:#0c1f19;--exp:#ec8069;--inc:#5fc78d;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(18px + env(safe-area-inset-top)) 0 10px}
/* iPhone'da 16px'ten küçük yazı alanına dokununca sayfa yakınlaşıyor; engelle. */
@media (max-width:760px){input,select,textarea{font-size:16px!important}}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
header h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1;min-width:140px}
.badge{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.badge b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:13px;margin:18px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}
small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.exp{color:var(--exp)}.inc{color:var(--inc)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--exp)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{font:inherit;color:inherit;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=color]{padding:2px;height:38px;width:48px}
label{display:block;font-size:13px;color:var(--muted)}
label>input,label>select,label>.amt{margin-top:4px}
.form-row{display:grid;gap:10px;grid-template-columns:1fr;align-items:end}
@media (min-width:640px){.form-row{grid-template-columns:repeat(var(--cols,3),1fr) auto}}
.amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.amt input{border:0;border-radius:10px 0 0 10px}
.amt input:focus{outline:none}
.amt:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.amt span{padding:0 12px;color:var(--muted);font-weight:600;font-size:13px}
.amt.auto{background:var(--soft);border-style:dashed}
.amt.auto input{background:transparent}
.amt.auto::after{content:"otomatik";font-size:11px;color:var(--accent);font-weight:600;padding-right:10px}
.fxbox{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.fxbox .hint{margin-top:-6px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px;cursor:pointer}
.check input{width:auto;margin:0}
.accs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.acc .n{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.acc .v{font-size:18px;font-weight:650;margin-top:2px}
.acc.group .sublines{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.subline{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.subline span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subline span:first-child::before{content:"↳ "}
.cur{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--muted)}
.periodbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pnav{display:flex;align-items:center;gap:6px}
.pnav .lbl{min-width:150px;text-align:center;font-weight:600}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--soft);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:5px 0;cursor:pointer;border-radius:8px}
.bar-row:hover .bar-lbl{text-decoration:underline}
.bar-lbl{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar-row.sub{padding:2px 0;font-size:13px;color:var(--muted)}
.bar-row.sub .bar-lbl::before{content:"↳";margin-left:-4px}
.bar-row.sub .bar-track{height:6px}
.bar-row.sub .bar-fill{opacity:.65}
.list-row.child{padding-left:28px}
.list-row.child .m b{font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar-track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-val{text-align:right;white-space:nowrap}
.bar-val small{color:var(--muted);margin-left:4px}
.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.tbar{width:100%;max-width:46px;background:var(--line);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.tcol.cur .tbar{background:var(--accent)}
.tcol .tl{font-size:11px;color:var(--muted);white-space:nowrap}
.tcol .tv{font-size:11px;color:var(--muted);white-space:nowrap}
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr auto}}
.day{font-size:12px;color:var(--muted);font-weight:600;padding:12px 2px 6px;display:flex;justify-content:space-between}
.tx{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}
.tx:hover{background:var(--soft)}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:#fff}
.tx .m{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:650;text-align:right;white-space:nowrap}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .m{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.fab{position:fixed;right:max(16px,calc(50vw - 474px));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5}
.fab .btn{box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:999px;padding:12px 18px}
@media (max-width:620px){.fab{left:12px;right:12px;justify-content:flex-end;flex-wrap:wrap;gap:6px}.fab .btn{padding:10px 12px;font-size:12px}}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg-head{display:flex;justify-content:space-between;align-items:center}
.dlg-head h2{margin:0}
.dlg-actions{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px}
.toast.undo{display:flex;gap:12px;align-items:center}
.toast.undo.on{pointer-events:auto}
.toast .btn{color:var(--ink);padding:3px 10px}
.icon.xs{width:24px;height:24px;font-size:11px;border-radius:6px;vertical-align:middle;margin-left:6px}
.debt{flex-wrap:wrap}
.debt .pays,.debt .acts{flex-basis:100%}
.debt .pays{display:grid;gap:3px;border-left:2px solid var(--line);padding-left:10px}
.debt .acts{display:flex;gap:6px;justify-content:flex-end}
.warn{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}
.warn .m{flex:1;min-width:160px}
.warn .m b{display:block}
.ok{color:var(--inc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
/* Rapor sadece yazdırırken (PDF) görünür; her zaman açık renkte basılır. */
#report{display:none}
@media print{
  :root,:root[data-theme],:root:not([data-theme="light"]){
    --bg:#fff;--card:#fff;--ink:#1c1c1a;--muted:#6d6b65;--line:#dedcd5;--soft:#f1efe9;--accent:#1f6f5c;--exp:#b4432f;--inc:#1f7a4a;
  }
  @page{margin:12mm}
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing .wrap,body.printing .fab,body.printing .toast,body.printing dialog{display:none!important}
  body.printing #report{display:block}
  #report h1{font-size:22px;margin:2px 0 0}
  #report h3{margin:18px 0 6px;break-after:avoid}
  #report .rp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:8px}
  #report .kpis{grid-template-columns:repeat(4,1fr)}
  #report .kpi small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
  #report .kpi .v{font-size:16px}
  #report td,#report th{padding:5px 4px;vertical-align:top}
  #report tr{break-inside:avoid}
  #report .r{text-align:right}
  #report .nw{white-space:nowrap}
  #report .dot{display:inline-block;margin-right:6px}
  #report tr.sub td{color:var(--muted);font-size:11px;padding-left:18px}
  #report tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kişisel Hesap</h1>
    <div class="seg" id="disp" title="Toplamlar hangi para biriminde gösterilsin">
      <button data-action="disp" data-cur="IQD">IQD</button>
      <button data-action="disp" data-cur="USD">USD</button>
    </div>
    <button class="badge" data-action="tab" data-tab="kur" id="rateBadge"></button>
  </header>
  <nav>
    <button class="tab" data-action="tab" data-tab="ozet">Özet</button>
    <button class="tab" data-action="tab" data-tab="islemler">İşlemler</button>
    <button class="tab" data-action="tab" data-tab="hesaplar">Hesaplar</button>
    <button class="tab" data-action="tab" data-tab="borclar">Borç/Alacak</button>
    <button class="tab" data-action="tab" data-tab="kategoriler">Kategoriler</button>
    <button class="tab" data-action="tab" data-tab="kur">Kur</button>
    <button class="tab" data-action="tab" data-tab="ayarlar">Ayarlar</button>
  </nav>
  <main id="view"></main>
</div>

<div class="fab">
  <button class="btn" data-action="new-tx" data-type="transfer" title="Hesaplar arası para gönder veya dinar ⇄ dolar bozdur">⇄ Transfer</button>
  <button class="btn" data-action="new-tx" data-type="income">+ Gelir</button>
  <button class="btn primary" data-action="new-tx" data-type="expense">+ Gider</button>
</div>

<dialog id="txDlg">
  <form class="dlg" id="txForm" novalidate>
    <div class="dlg-head"><h2 id="txTitle">Yeni işlem</h2><button type="button" class="icon" data-action="close-dlg" aria-label="Kapat">✕</button></div>
    <div class="seg" id="txType">
      <button type="button" data-action="tx-type" data-type="expense">Gider</button>
      <button type="button" data-action="tx-type" data-type="income">Gelir</button>
      <button type="button" data-action="tx-type" data-type="transfer">Transfer</button>
    </div>
    <label>Tarih<input type="date" name="date" required></label>
    <label><span id="accLbl">Hesap</span><select name="accountId"></select></label>
    <label>Tutar
      <div class="amt" id="amtBox"><input name="amount" inputmode="decimal" autocomplete="off" placeholder="0"><span id="amtCur">IQD</span></div>
      <div class="hint" id="amtHint"></div>
    </label>
    <label id="catWrap">Kategori<select name="categoryId"></select></label>
    <label id="toWrap">Hedef hesap<select name="toAccountId"></select></label>
    <div id="toEmpty" class="fxbox hide">
      <div style="font-size:13px">Transfer için ikinci bir hesap gerekli — paranın gireceği başka hesap yok.</div>
      <div><button type="button" class="btn primary sm" data-action="quick-acc" id="quickAccBtn"></button></div>
    </div>
    <div id="toAmtWrap" class="fxbox">
      <label>Hedef hesaba giren tutar
        <div class="amt" id="toAmtBox"><input name="toAmount" inputmode="decimal" autocomplete="off" placeholder="0"><span id="toCur"></span></div></label>
      <label>Kur — 1 $ kaç dinar?
        <div class="amt" id="fxRateBox"><input name="fxRate" inputmode="decimal" autocomplete="off" placeholder="0"><span>IQD</span></div></label>
      <div class="hint" id="fxHint"></div>
      <label class="check"><input type="checkbox" name="saveRate"> Bu kuru <span id="fxDate"></span> günün kuru olarak kaydet</label>
    </div>
    <label id="feeWrap">Transfer ücreti <span class="muted">(ücret yoksa boş bırakın — 0 sayılır)</span>
      <div class="amt"><input name="fee" inputmode="decimal" autocomplete="off" placeholder="0"><span id="feeCur">IQD</span></div>
      <div class="hint" id="feeHint"></div>
    </label>
    <div class="hint" id="trHint" style="min-height:0"></div>
    <label>Not<input name="note" maxlength="140" placeholder="İsteğe bağlı" autocomplete="off"></label>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="txDel" data-action="tx-del">Sil</button>
      <span class="sp"></span>
      <button type="button" class="btn" data-action="close-dlg">Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="payDlg">
  <form class="dlg" id="payForm" novalidate>
    <div class="dlg-head"><h2 id="payTitle">Ödeme</h2><button type="button" class="icon" data-action="close-pay" aria-label="Kapat">✕</button></div>
    <div class="muted" id="payInfo"></div>
    <label><span id="payAccLbl">Hesap</span><select name="accountId" required></select></label>
    <label>Tarih<input type="date" name="date" required></label>
    <label>Tutar
      <div class="amt"><input name="amount" inputmode="decimal" autocomplete="off" placeholder="0"><span id="payCur">IQD</span></div>
    </label>
    <label>Not<input name="note" maxlength="100" placeholder="İsteğe bağlı" autocomplete="off"></label>
    <div class="dlg-actions">
      <button type="button" class="btn sm" data-action="pay-all">Kalanın tamamı</button>
      <span class="sp"></span>
      <button type="button" class="btn" data-action="close-pay">Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<div id="report"></div>

<script>
const KEY = 'kisisel-hesap-v1';
const PALETTE = ['#d9534f','#e8a33d','#3b82c4','#2e9e6b','#9b59b6','#e76f51','#14b8a6','#8d6e63','#64748b','#c2410c','#db2777','#65a30d'];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);

/* ---------- veri ---------- */
function seed() {
  const c = (name, type, i) => ({ id: uid(), name, type, color: PALETTE[i % PALETTE.length] });
  return {
    version: 1,
    rates: [{ id: uid(), date: today(), rate: 1310 }],
    accounts: [
      { id: uid(), name: 'Nakit Dinar', currency: 'IQD', opening: 0 },
      { id: uid(), name: 'Nakit Dolar', currency: 'USD', opening: 0 },
    ],
    categories: (() => {
      const yemek = c('Yemek', 'expense', 0), araba = c('Araba', 'expense', 2);
      const sub = (p, name) => ({ ...c(name, p.type, 0), color: p.color, parentId: p.id });
      return [
        yemek, sub(yemek, 'Market'), sub(yemek, 'Restoran'),
        araba, sub(araba, 'Benzin'), sub(araba, 'Bakım / Tamir'), sub(araba, 'Yıkama'),
        c('Faturalar', 'expense', 4), c('Diğer', 'expense', 7),
        c('Maaş', 'income', 6), c('Diğer gelir', 'income', 11),
      ];
    })(),
    tx: [],
    debts: [],
    settings: { display: 'IQD', weekStart: 1, lastBackup: '' },
  };
}
/* Eski kayıtlarda/yedeklerde olmayan alanları tamamlar (ör. borç/alacak listesi). */
function norm(d) {
  if (!Array.isArray(d.debts)) d.debts = [];
  d.debts.forEach(x => {
    if (!Array.isArray(x.payments)) x.payments = [];
    x.payments.forEach(p => { if (!p.accountId) p.accountId = ''; if (!p.txId) p.txId = ''; });
    if (!x.accountId) x.accountId = '';
    if (!x.txId) x.txId = '';
    x.opening = !!x.opening;
  });
  d.settings = Object.assign({ display: 'IQD', weekStart: 1, lastBackup: '' }, d.settings);
  return d;
}
function load() {
  try { const s = localStorage.getItem(KEY); return s ? norm(JSON.parse(s)) : null; } catch (e) { return null; }
}
/* Geri yükleme / sıfırlama gibi büyük işlemlerden önce verinin bir kopyası ayrıca saklanır. */

function takeSnapshot(reason) {

}
function loadSnap() {

}
const snap = () => JSON.stringify(db);
const fmtTs = ts => new Date(ts).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
function save() {

}
let db = load() || seed();

const ui = {
  tab: 'ozet', period: 'month', anchor: today(),
  f: { q: '', acc: '', cat: '', from: '', to: '' },
  editAcc: null, editCat: null,
};

const acc = id => db.accounts.find(a => a.id === id);
const cat = id => db.categories.find(c => c.id === id);
const disp = () => db.settings.display;
/* Kategoriler iki seviyeli: ana kategori ve (parentId ile) alt kategori. */
const parents = tp => db.categories.filter(c => c.type === tp && (!c.parentId || !cat(c.parentId)));
const children = id => db.categories.filter(c => c.parentId === id);
const topOf = id => { const c = cat(id); return c && c.parentId && cat(c.parentId) ? c.parentId : id; };
const catLabel = c => { const p = c && c.parentId ? cat(c.parentId) : null; return c ? (p ? `${p.name} › ${c.name}` : c.name) : ''; };
/* Hesaplar da iki seviyeli: ana hesap (ör. ZainCash) ve altındaki kartlar. Her biri kendi para birimi ve bakiyesiyle gerçek bir hesaptır. */
const accParents = () => db.accounts.filter(a => !a.parentId || !acc(a.parentId));
const accChildren = id => db.accounts.filter(a => a.parentId === id);
const accOrdered = () => accParents().flatMap(p => [p, ...accChildren(p.id)]);
const accLabel = a => { const p = a && a.parentId ? acc(a.parentId) : null; return a ? (p ? `${p.name} › ${a.name}` : a.name) : '?'; };
const accUsed = id => db.tx.some(t => t.accountId === id || t.toAccountId === id);
function accOptions(list, selected) {
  const ids = new Set(list.map(a => a.id));
  return list.map(a => {
    const child = a.parentId && acc(a.parentId);
    const text = child ? (ids.has(a.parentId) ? `   ↳ ${a.name}` : accLabel(a)) : a.name;

}
/* Ana kategoriler ve altlarında girintili alt kategoriler; seçilen değer işaretlenir. */
function catOptions(tp, selected) {

    children(p.id).map(c => `<option value="${c.id}" ${selected === c.id ? 'selected' : ''}>   ↳ ${esc(c.name)}</option>`).join('')).join('');
}

/* ---------- kur & para ---------- */
function sortedRates() { return [...db.rates].sort((a, b) => a.date.localeCompare(b.date)); }
function curRate() { const r = sortedRates(); return r.length ? r[r.length - 1].rate : 1310; }
function rateAt(date) {
  const rs = sortedRates(); let r = rs.length ? rs[0].rate : 1310;
  for (const x of rs) { if (x.date <= date) r = x.rate; else break; }
  return r;
}
function conv(v, from, to, rate) {
  if (from === to) return v;
  return from === 'USD' ? v * rate : v / rate;
}
/* Sayı biçimi: nokta ondalık, virgül binlik ayırıcı (20.32 · 3,200 · 1,250,000). */
function fmtNum(n, dec = 0) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmt(n, cur, signed = false) {
  const neg = n < 0 && Math.abs(n) >= (cur === 'USD' ? 0.005 : 0.5);
  const sign = neg ? '−' : (signed && n > 0 ? '+' : '');
  const a = Math.abs(n);
  return cur === 'USD' ? `${sign}$${fmtNum(a, 2)}` : `${sign}${fmtNum(a)} IQD`;
}
function num(s) {
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  // Virgül binlik ayırıcıdır, atılır; nokta ondalıktır.
  return Number(s.replace(/,/g, ''));
}
/* Girdi kutusuna yazılacak biçim (num() geri okuyabilir): 100,000 · 76.34 · 1,310.5 */
function fmtIn(v, kind) {
  const d = kind === 'IQD' ? 0 : 2;
  return v > 0 && isFinite(v) ? v.toLocaleString('en-US', { maximumFractionDigits: d }) : '';
}
function solveFx(target, iqd, usd, rate) {
  if (target === 'rate') return iqd > 0 && usd > 0 ? iqd / usd : NaN;
  if (target === 'iqd') return usd > 0 && rate > 0 ? usd * rate : NaN;
  return iqd > 0 && rate > 0 ? iqd / rate : NaN;
}
function touch(order, k) { const i = order.indexOf(k); if (i >= 0) order.splice(i, 1); order.push(k); }
function setRate(date, rate) {
  rate = Math.round(rate * 100) / 100;
  db.rates = db.rates.filter(r => r.date !== date);
  db.rates.push({ id: uid(), date, rate });
}

/* upto verilirse o tarihin sonundaki bakiye (rapor için). */
function balance(id, upto) {
  const a = acc(id); if (!a) return 0;
  let b = Number(a.opening) || 0;
  for (const t of db.tx) {
    if (upto && t.date > upto) continue;
    if (t.accountId === id) {
      if (t.type === 'income' || t.type === 'opening' || t.type === 'debt-in') b += t.amount;
      else if (t.type === 'expense' || t.type === 'debt-out') b -= t.amount;
      else if (t.type === 'transfer') b -= t.amount + (t.fee || 0);
    }
    if (t.type === 'transfer' && t.toAccountId === id) b += t.toAmount;
  }
  return b;
}
/* Harcama sayılan kısım (çıkan hesabın para biriminde): gider tutarı veya transfer ücreti. */
const txCost = t => t.type === 'expense' ? t.amount : t.type === 'transfer' ? (t.fee || 0) : 0;
const FEE = '__fee';

/* ---------- dönemler ---------- */
const MONTH = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' });
const MSHORT = new Intl.DateTimeFormat('tr-TR', { month: 'short' });
const DAYFMT = new Intl.DateTimeFormat('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function range(kind, anchor) {
  const d = parse(anchor);
  if (kind === 'week') {
    const off = (d.getDay() - db.settings.weekStart + 7) % 7;
    const s = addDays(d, -off), e = addDays(s, 6);
    const lbl = s.getMonth() === e.getMonth()
      ? `${s.getDate()} – ${e.getDate()} ${MSHORT.format(e)} ${e.getFullYear()}`
      : `${s.getDate()} ${MSHORT.format(s)} – ${e.getDate()} ${MSHORT.format(e)} ${e.getFullYear()}`;
    return { start: ymd(s), end: ymd(e), label: lbl, short: `${s.getDate()} ${MSHORT.format(s)}` };
  }
  const s = new Date(d.getFullYear(), d.getMonth(), 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const lbl = MONTH.format(s);
  return { start: ymd(s), end: ymd(e), label: lbl[0].toUpperCase() + lbl.slice(1), short: MSHORT.format(s) };
}
function shift(kind, anchor, n) {
  const d = parse(anchor);
  return kind === 'week' ? ymd(addDays(d, 7 * n)) : ymd(new Date(d.getFullYear(), d.getMonth() + n, 1));
}
function stats(start, end) {
  const D = disp(); let exp = 0, inc = 0; const byCat = {}, byTop = {}; const native = { IQD: 0, USD: 0 };
  for (const t of db.tx) {
    if (t.date < start || t.date > end) continue;
    const a = acc(t.accountId); if (!a) continue;
    const cost = t.type === 'income' ? t.amount : txCost(t);
    if (!cost) continue;
    const v = conv(cost, a.currency, D, rateAt(t.date));
    if (t.type !== 'income') {
      exp += v; native[a.currency] += cost;
      const k = t.type === 'transfer' ? FEE : t.categoryId && cat(t.categoryId) ? t.categoryId : '';
      const top = k && k !== FEE ? topOf(k) : k;
      byCat[k] = (byCat[k] || 0) + v;
      byTop[top] = (byTop[top] || 0) + v;
    } else inc += v;
  }
  return { exp, inc, byCat, byTop, native };
}

/* ---------- görünümler ---------- */
function vOzet() {
  const D = disp(), r = curRate();
  const total = db.accounts.reduce((s, a) => s + conv(balance(a.id), a.currency, D, r), 0);
  const rg = range(ui.period, ui.anchor);
  const st = stats(rg.start, rg.end);
  const t = today();
  let days = daysBetween(rg.start, rg.end) + 1;
  if (t >= rg.start && t <= rg.end) days = daysBetween(rg.start, t) + 1;
  const avg = rg.start > t ? 0 : st.exp / days;

  const cats = Object.entries(st.byTop).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const barRow = (id, name, v, col, sub) => `<div class="bar-row ${sub ? 'sub' : ''}" data-action="drill" data-cat="${esc(id)}" title="İşlemleri gör">
      <div class="bar-lbl">${sub ? '<span class="dot" style="background:transparent"></span>' : `<span class="dot" style="background:${col}"></span>`}${esc(name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, v / max * 100)}%;background:${col}"></div></div>
      <div class="bar-val num">${fmt(v, D)}<small>${Math.round(v / st.exp * 100)}%</small></div></div>`;
  const bars = cats.map(([id, v]) => {
    const c = cat(id), col = c ? c.color : id === FEE ? '#64748b' : '#999';
    let html = barRow(id, c ? c.name : id === FEE ? 'Transfer ücretleri' : 'Kategorisiz', v, col, false);
    const subs = id && id !== FEE ? children(id).filter(s => st.byCat[s.id]).map(s => [s.id, s.name, st.byCat[s.id], s.color]) : [];
    if (subs.length) {
      if (st.byCat[id]) subs.push([id, `${c.name} (genel)`, st.byCat[id], col]);
      html += subs.sort((a, b) => b[2] - a[2]).map(([sid, n, sv, sc]) => barRow(sid, n, sv, sc, true)).join('');
    }
    return html;
  }).join('');

  const N = ui.period === 'week' ? 8 : 6, cols = [];
  for (let i = N - 1; i >= 0; i--) {
    const g = range(ui.period, shift(ui.period, ui.anchor, -i));
    cols.push({ label: g.short, full: g.label, v: stats(g.start, g.end).exp, cur: i === 0 });
  }
  const tmax = Math.max(...cols.map(c => c.v), 1);
  const compact = v => D === 'USD' ? '$' + fmtNum(v) : (v >= 1e6 ? fmtNum(v / 1e6, 1) + 'M' : v >= 1e3 ? fmtNum(v / 1e3) + 'K' : fmtNum(v));
  const trend = cols.map(c => `<div class="tcol ${c.cur ? 'cur' : ''}" title="${esc(c.full)}: ${fmt(c.v, D)}">
      <div class="tv num">${c.v ? compact(c.v) : ''}</div>
      <div class="tbar" style="height:${c.v / tmax * 100}%"></div>
      <div class="tl">${esc(c.label)}</div></div>`).join('');

  const nativeLine = (st.native.IQD || st.native.USD)
    ? `<div class="muted" style="margin-top:10px;font-size:13px">Hesap para birimine göre harcanan: <b class="num">${fmt(st.native.IQD, 'IQD')}</b> + <b class="num">${fmt(st.native.USD, 'USD')}</b></div>` : '';

  const warn = backupStale() ? `<div class="card warn">
    <div class="m"><b>Yedek almayı unutmayın</b><small class="muted">${backupAge() === null
      ? 'Veriler sadece bu cihazda. Cihaz verisi silinirse işlemleriniz kaybolur.'
      : `En son ${backupAge()} gün önce yedeklediniz.`}</small></div>
    <button class="btn primary" data-action="export">Yedekle</button>
    <button class="btn sm" data-action="tab" data-tab="ayarlar">Ayarlar</button>
  </div>` : '';

  return warn + `
  <div class="card">
    <div class="muted" style="font-size:13px">Toplam varlık (${D})</div>
    <div class="big num">${fmt(total, D)}</div>
    <div class="muted" style="font-size:12px;margin-bottom:12px">Güncel kurla: 1 $ = ${fmtNum(r)} IQD</div>
    ${db.accounts.length ? `<div class="accs">${accParents().map(a => {
      const b = balance(a.id), kids = accChildren(a.id);
      if (!kids.length) return `<div class="acc"><div class="n"><span>${esc(a.name)}</span><span class="cur">${a.currency}</span></div>
        <div class="v num ${b < 0 ? 'exp' : ''}">${fmt(b, a.currency)}</div></div>`;
      // Grup kartı: toplam + ana hesabın kendi bakiyesi (kullanılıyorsa) + alt hesaplar
      const members = (accUsed(a.id) || Number(a.opening) ? [a] : []).concat(kids);
      const tot = [a, ...kids].reduce((s, x) => s + conv(balance(x.id), x.currency, D, r), 0);
      return `<div class="acc group"><div class="n"><span>${esc(a.name)}</span><span class="cur">≈ ${D}</span></div>
        <div class="v num ${tot < 0 ? 'exp' : ''}">${fmt(tot, D)}</div>
        <div class="sublines">${members.map(x => {
          const xb = balance(x.id);
          return `<div class="subline"><span>${x === a ? 'Ana hesap' : esc(x.name)}</span><span class="num ${xb < 0 ? 'exp' : ''}">${fmt(xb, x.currency)}</span></div>`;
        }).join('')}</div></div>`;
    }).join('')}</div>` : `<div class="empty">Henüz hesap yok. <button class="btn sm" data-action="tab" data-tab="hesaplar">Hesap ekle</button></div>`}
  </div>

  <div class="card">
    <div class="periodbar">
      <div class="seg">
        <button data-action="period" data-p="week" class="${ui.period === 'week' ? 'on' : ''}">Haftalık</button>
        <button data-action="period" data-p="month" class="${ui.period === 'month' ? 'on' : ''}">Aylık</button>
      </div>
      <div class="pnav">
        <button class="icon" data-action="shift" data-n="-1" aria-label="Önceki">‹</button>
        <span class="lbl">${esc(rg.label)}</span>
        <button class="icon" data-action="shift" data-n="1" aria-label="Sonraki">›</button>
        <button class="btn sm" data-action="now">Bugün</button>
      </div>
      <button class="btn sm" data-action="report" title="Bu ${ui.period === 'week' ? 'haftanın' : 'ayın'} raporunu PDF olarak kaydet">📄 PDF rapor</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Harcama</div><div class="v num exp">${fmt(st.exp, D)}</div></div>
      <div class="kpi"><div class="l">Gelir</div><div class="v num inc">${fmt(st.inc, D)}</div></div>
      <div class="kpi"><div class="l">Net</div><div class="v num ${st.inc - st.exp < 0 ? 'exp' : 'inc'}">${fmt(st.inc - st.exp, D, true)}</div></div>
      <div class="kpi"><div class="l">Günlük ortalama harcama</div><div class="v num">${fmt(avg, D)}</div></div>
    </div>
    ${nativeLine}
    <h3>Kategoriye göre harcama</h3>
    ${bars || '<div class="empty">Bu dönemde harcama yok.</div>'}
    <h3>Son ${N} ${ui.period === 'week' ? 'hafta' : 'ay'} — harcama</h3>
    <div class="trend">${trend}</div>
  </div>`;
}

/* ---------- rapor (PDF) ---------- */
/* Rapor, tarayıcının yazdırma ekranıyla PDF'e dönüşür.
   iPhone'da: Yazdır ekranında Paylaş simgesi → Dosyalar'a Kaydet; bilgisayarda: Hedef → PDF olarak kaydet. */
function reportHtml(kind, anchor) {
  const D = disp(), rg = range(kind, anchor), st = stats(rg.start, rg.end);
  const prg = range(kind, shift(kind, anchor, -1)), ps = stats(prg.start, prg.end);
  const t = today(), word = kind === 'week' ? 'hafta' : 'ay';
  let days = daysBetween(rg.start, rg.end) + 1;
  if (t >= rg.start && t <= rg.end) days = daysBetween(rg.start, t) + 1;
  const avg = rg.start > t ? 0 : st.exp / days;
  // Önceki döneme göre değişim; harcamada artış kötü (kırmızı), gelirde iyi.
  const chg = (v, p, good) => {
    if (!p) return '<span class="muted">—</span>';
    const pct = Math.round((v - p) / p * 100);
    const cls = pct === 0 ? 'muted' : (pct > 0) === good ? 'inc' : 'exp';
    return `<span class="${cls}">${pct > 0 ? '+' : pct < 0 ? '−' : ''}${Math.abs(pct)}%</span>`;
  };
  const catName = id => { const c = cat(id); return c ? c.name : id === FEE ? 'Transfer ücretleri' : 'Kategorisiz'; };
  const catRows = Object.entries(st.byTop).sort((a, b) => b[1] - a[1]).map(([id, v]) => {
    const c = cat(id), col = c ? c.color : id === FEE ? '#64748b' : '#999';
    let html = `<tr><td><span class="dot" style="background:${col}"></span>${esc(catName(id))}</td>
      <td class="num r">${fmt(v, D)}</td><td class="num r">${Math.round(v / st.exp * 100)}%</td>
      <td class="num r">${fmt(ps.byTop[id] || 0, D)}</td><td class="num r">${chg(v, ps.byTop[id], false)}</td></tr>`;
    if (id && id !== FEE) {
      const subs = children(id).filter(x => st.byCat[x.id]).map(x => [x.name, st.byCat[x.id]]);
      if (subs.length && st.byCat[id]) subs.push([`${c.name} (genel)`, st.byCat[id]]);
      html += subs.sort((a, b) => b[1] - a[1]).map(([n, sv]) => `<tr class="sub"><td>↳ ${esc(n)}</td>
        <td class="num r">${fmt(sv, D)}</td><td class="num r">${Math.round(sv / st.exp * 100)}%</td><td></td><td></td></tr>`).join('');
    }
    return html;
  }).join('');

  const txs = db.tx.filter(x => x.date >= rg.start && x.date <= rg.end)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0));
  const big = txs.filter(x => x.type === 'expense' && acc(x.accountId))
    .map(x => [x, conv(x.amount, acc(x.accountId).currency, D, rateAt(x.date))])
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  const txTable = list => `<table><tr><th>Tarih</th><th>İşlem</th><th class="r">Tutar</th></tr>${list.map(x => {
    const i = txInfo(x);
    return `<tr><td class="nw">${esc(SHORTDATE.format(parse(x.date)))}</td><td><b>${esc(i.title)}</b><br><small class="muted">${esc(i.sub)}</small></td><td class="num r">${i.amt}</td></tr>`;
  }).join('')}</table>`;

  const endBal = rg.end < t ? rg.end : t;
  const accRows = accOrdered().map(a => {
    const b = balance(a.id, endBal);
    return `<tr><td>${esc(accLabel(a))}</td><td class="num r ${b < 0 ? 'exp' : ''}">${fmt(b, a.currency)}</td></tr>`;
  }).join('');
  const total = db.accounts.reduce((s, a) => s + conv(balance(a.id, endBal), a.currency, D, rateAt(endBal)), 0);
  const debts = db.debts.filter(debtOpen), dt = debtTotals();

  return `
  <div class="rp-head">
    <div><div class="muted">Kişisel Hesap · ${kind === 'week' ? 'Haftalık' : 'Aylık'} rapor</div><h1>${esc(rg.label)}</h1></div>
    <div class="muted r" style="font-size:12px">Hazırlanma: ${esc(fmtTs(Date.now()))}<br>Tutarlar: ${D} · 1 $ = ${fmtNum(rateAt(endBal))} IQD</div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Harcama</div><div class="v num exp">${fmt(st.exp, D)}</div><small>Önceki ${word}: ${fmt(ps.exp, D)} · ${chg(st.exp, ps.exp, false)}</small></div>
    <div class="kpi"><div class="l">Gelir</div><div class="v num inc">${fmt(st.inc, D)}</div><small>Önceki ${word}: ${fmt(ps.inc, D)} · ${chg(st.inc, ps.inc, true)}</small></div>
    <div class="kpi"><div class="l">Net</div><div class="v num ${st.inc - st.exp < 0 ? 'exp' : 'inc'}">${fmt(st.inc - st.exp, D, true)}</div><small>Önceki ${word}: ${fmt(ps.inc - ps.exp, D, true)}</small></div>
    <div class="kpi"><div class="l">Günlük ortalama harcama</div><div class="v num">${fmt(avg, D)}</div><small>${days} gün</small></div>
  </div>
  <h3>Kategoriye göre harcama</h3>
  ${catRows ? `<table><tr><th>Kategori</th><th class="r">Tutar</th><th class="r">Pay</th><th class="r">Önceki ${word}</th><th class="r">Değişim</th></tr>${catRows}</table>` : '<p class="muted">Bu dönemde harcama yok.</p>'}
  ${big.length ? `<h3>En büyük ${big.length} harcama</h3>${txTable(big.map(([x]) => x))}` : ''}
  <h3>Hesap bakiyeleri (${esc(SHORTDATE.format(parse(endBal)))})</h3>

function renderTxList() {
  const el = $('#txlist'); if (!el) return;
  const f = ui.f, q = f.q.trim().toLocaleLowerCase('tr');
  const D = disp();
  const rows = db.tx.filter(t => {
    // Ana hesap seçiliyse alt hesaplarının (kartlarının) işlemleri de gelir.
    const inAcc = id => id && (id === f.acc || acc(id)?.parentId === f.acc);
    if (f.acc && !inAcc(t.accountId) && !inAcc(t.toAccountId)) return false;
    if (f.cat === '__transfer' && t.type !== 'transfer') return false;
    if (f.cat === '__debt' && t.type !== 'debt-in' && t.type !== 'debt-out') return false;
    if (f.cat === '__opening' && t.type !== 'opening') return false;
    // Ana kategori seçiliyse alt kategorilerinin işlemleri de gelir.
    if (f.cat && !['__transfer','__debt','__opening'].includes(f.cat) && t.categoryId !== f.cat && cat(t.categoryId)?.parentId !== f.cat) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (q) {
      const c = cat(t.categoryId);
      const hay = `${t.note || ''} ${t.person || ''} ${catLabel(c)} ${accLabel(acc(t.accountId))} ${t.toAccountId ? accLabel(acc(t.toAccountId)) : ''}`.toLocaleLowerCase('tr');
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));

  let exp = 0, inc = 0;
  for (const t of rows) {
    const a = acc(t.accountId); if (!a) continue;
    if (t.type === 'income') inc += conv(t.amount, a.currency, D, rateAt(t.date));
    else exp += conv(txCost(t), a.currency, D, rateAt(t.date));
  }
  const active = f.q || f.acc || f.cat || f.from || f.to;
  const summary = `<div class="chips"><span class="chip">${rows.length} işlem</span>
    <span class="chip">Harcama: <b class="exp num">${fmt(exp, D)}</b></span>
    <span class="chip">Gelir: <b class="inc num">${fmt(inc, D)}</b></span>
    ${active ? '<span class="chip">Filtre açık</span>' : ''}</div>`;

  if (!rows.length) {
    el.innerHTML = summary + `<div class="empty">${db.tx.length ? 'Filtreye uyan işlem yok.' : 'Henüz işlem yok. Sağ alttaki <b>+ Gider</b> ile başlayın.'}</div>`;
    return;
  }
  let html = summary, lastDay = '';
  const dayTotals = {};
  for (const t of rows) {
    const a = acc(t.accountId), cost = txCost(t); if (!a || !cost) continue;
    dayTotals[t.date] = (dayTotals[t.date] || 0) + conv(cost, a.currency, D, rateAt(t.date));
  }

    }

function txInfo(t) {
  const a = acc(t.accountId), cur = a ? a.currency : '';

  if (t.type === 'transfer') {

/* Mesajdaki dolar kurlarını bulur. Irak'ta kur çoğunlukla 100 $ için yazılır (146,750 → 1 $ = 1,467.5).
   Binlik ayırıcı virgül, nokta veya boşluk olabilir; Arapça/Farsça rakamlar çevrilir.
   Mantıklı aralıktaki her sayı aday olur; dolar geçen satırlar öne alınır, kullanıcı doğrusunu seçer. */
const RATE_MIN = 900, RATE_MAX = 3000;
function readRates(text) {
  const s = String(text || '')
    .replace(/[٠-٩]/g, c => c.charCodeAt(0) - 0x660)
    .replace(/[۰-۹]/g, c => c.charCodeAt(0) - 0x6F0)
    .replace(/٬/g, ',').replace(/٫/g, '.');
  const found = [], seen = new Set();
  for (const line of s.split(/\n+/)) {
    const usd = /\$|dolar|dollar|usd|دولار|دۆلار/i.test(line);
    let prevEnd = 0;
    for (const m of line.matchAll(/\d{1,3}(?:[.,\s]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?/g)) {
      const tok = m[0], prev = line[m.index - 1], next = line[m.index + tok.length];
      // Tarih parçası (8/10/2026) ve saat değil.
      if (/[\/:-]/.test(prev || '') || /[\/:]/.test(next || '')) continue;
      // Etiket: önceki sayıdan bu sayıya kadar olan yazı (ör. "بيع", "Erbil"); yoksa sonrası.
      const before = line.slice(prevEnd, m.index), after = line.slice(m.index + tok.length).split(/\d/)[0];
      prevEnd = m.index + tok.length;
      const ways = [Number(tok.replace(/[,\s]/g, '')), Number(tok.replace(/[.\s]/g, '').replace(',', '.'))];
      for (const v of ways) {
        if (!isFinite(v)) continue;
        const per100 = v >= RATE_MIN * 100 && v <= RATE_MAX * 100;
        if (!per100 && !(v >= RATE_MIN && v <= RATE_MAX)) continue;
        const rate = Math.round((per100 ? v / 100 : v) * 100) / 100;
        if (!seen.has(rate)) {
          seen.add(rate);
          const clean = x => x.replace(/[=:$\-–—]+/g, ' ').replace(/\s+/g, ' ').trim();
          const label = (clean(before) || clean(after)).slice(0, 40);
          found.push({ rate, tok: tok.trim(), per100, label, usd });
        }
        break;
      }
    }
  }
  return found.sort((a, b) => b.usd - a.usd);
}
function renderFound() {
  const el = $('#rateFound'); if (!el) return;
  const txt = $('#rateText').value.trim();
  if (!txt) { el.innerHTML = ''; return; }
  const list = readRates(txt);
  el.innerHTML = list.length ? `<div style="margin-top:10px">${list.map(x => `<div class="list-row">
      <div class="m"><b class="num">1 $ = ${fmtNum(x.rate, x.rate % 1 ? 2 : 0)} IQD</b>
        <div class="muted" style="font-size:12px">“${esc(x.tok)}”${x.per100 ? ' (100 $ için)' : ''}${x.label ? ' · ' + esc(x.label) : ''}</div></div>
      <button class="btn sm primary" data-action="use-rate" data-rate="${x.rate}">Kaydet</button></div>`).join('')}</div>`
    : '<p class="hint">Mesajda kur bulunamadı. 1 $ için 900–3,000 ya da 100 $ için 90,000–300,000 arası bir sayı olmalı.</p>';

/* Borç ve alacak hareketleri gerçek hesap bakiyelerine bağlıdır; gelir/gider istatistiğine dahil edilmez. */
const SHORTDATE = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
const debtPaid = x => x.payments.reduce((s, p) => s + p.amount, 0);
const debtLeft = x => Math.max(0, x.amount - debtPaid(x));

const debtAccounts = cur => accOrdered().filter(a => a.currency === cur);

  const list = debtAccounts(cur);

}
function debtTotals() {
  const D = disp(), r = curRate(), t = { lent: 0, owed: 0 };
  for (const x of db.debts) if (debtOpen(x)) t[x.dir] += conv(debtLeft(x), x.currency, D, r);
  return t;
}
function debtRow(x) {

/* ---------- yedek ---------- */
/* Yedek, uygulamanın tüm verisini tek bir .json dosyasına yazar.
   iPhone ana ekran uygulamasında indirme çalışmadığı için Paylaş menüsü kullanılır
   (Dosyalar'a Kaydet, iCloud Drive, WhatsApp…); masaüstünde normal indirme olur. */
const backupAge = () => db.settings.lastBackup ? daysBetween(db.settings.lastBackup, today()) : null;
const backupStale = () => db.tx.length > 0 && (backupAge() === null || backupAge() >= 7);
function backupLine() {
  const n = backupAge();
  if (n === null) return db.tx.length ? '⚠️ Henüz hiç yedek almadınız.' : 'Henüz yedek alınmadı.';
  if (n <= 0) return '<span class="ok">✓ Bugün yedeklendi.</span>';
  const s = n === 1 ? 'Son yedek: dün.' : `Son yedek: ${n} gün önce.`;
  return backupStale() ? '⚠️ ' + s : `<span class="ok">✓</span> ${s}`;
}
function markBackup() { db.settings.lastBackup = today(); save(); render(); }
function backupFile() {
  const name = `kisisel-hesap-yedek-${today()}.json`;
  return new File([JSON.stringify(db, null, 2)], name, { type: 'application/json' });
}
function downloadBackup(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  markBackup(); toast('Yedek indirildi');
}
async function doBackup() {
  const file = backupFile();
  // canShare/share, tıklama anında çağrılmalı — bu yüzden await'ten önce kontrol edilir.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Kişisel Hesap yedeği' });
      markBackup(); toast('Yedek kaydedildi');
    } catch (err) {
      // Kullanıcı paylaşım menüsünü kapattıysa sessizce vazgeç; başka hatada indirmeyi dene.
      if (!err || err.name !== 'AbortError') downloadBackup(file);
    }
    return;
  }
  downloadBackup(file);
}

  const views = { ozet: vOzet, islemler: vTx, hesaplar: vAcc, borclar: vDebt, kategoriler: vCat, kur: vRate, ayarlar: vSet };

/* ---------- işlem penceresi ---------- */
/* Döviz alanları: dinar, dolar ve kurdan en son yazılan ikisi korunur, en eski olanı hesaplanır. */
const FX_DEFAULT = () => ['toAmount', 'fxRate', 'amount'];
const dlg = { type: 'expense', id: null, fxOrder: FX_DEFAULT(), rateTyped: false };
const F = () => $('#txForm').elements;
function resetFx() { dlg.fxOrder = FX_DEFAULT(); dlg.rateTyped = false; F().toAmount.value = ''; }
function openTx(type, id, preset) {
  if (!db.accounts.length) { toast('Önce bir hesap ekleyin.'); ui.tab = 'hesaplar'; render(); return; }
  const t = id ? db.tx.find(x => x.id === id) : null;
  dlg.type = t ? t.type : type; dlg.id = t ? t.id : null;
  const f = F();
  resetFx();
  f.toAccountId.innerHTML = '';
  f.date.value = t ? t.date : today();
  const lastAcc = dlg.type === 'income' ? ui.lastIncAcc : dlg.type === 'expense' ? ui.lastExpAcc : dlg.type === 'opening' ? ui.lastOpeningAcc : ui.lastTrAcc;
  fillAccSelect(f.accountId, preset ? preset.from : t ? t.accountId : lastAcc);
  f.amount.value = t ? fmtIn(t.amount, 'any') : preset ? fmtIn(preset.amount, 'any') : '';
  f.note.value = t ? (t.note || '') : '';
  f.fee.value = t && t.fee ? fmtIn(t.fee, 'any') : '';
  f.saveRate.checked = !t;
  syncTx(t);
  const tr = t && t.type === 'transfer' ? t : preset;
  if (tr) {
    f.toAccountId.value = t ? t.toAccountId : preset.to;
    f.toAmount.value = fmtIn(tr.toAmount, 'any');
    // İki tutar da belli: kur onlardan hesaplanır, tutarlara dokunulmaz.
    dlg.fxOrder = ['fxRate', 'amount', 'toAmount'];
    syncTx();
  }
  $('#txTitle').textContent = t ? 'İşlemi düzenle' : dlg.type === 'transfer' ? 'Hesaplar arası transfer' : dlg.type === 'opening' ? 'Başlangıç Girişi' : 'Yeni işlem';
  $('#txDel').classList.toggle('hide', !t);
  $('#txDlg').showModal();
  if (!t) setTimeout(() => f.amount.focus(), 30);
}
function fillAccSelect(sel, value, exclude) {
  const list = accOrdered().filter(a => a.id !== exclude);
  sel.innerHTML = accOptions(list);
  if (value && list.some(a => a.id === value)) sel.value = value;
}
/* Transferin iki ucunu tek satırda özetler: çıkan hesaptan düşen (tutar + ücret) ve hedefe giren. */
function trSummary(a, b, amt, toAmt, fee) {
  if (!a || !b || !(amt > 0)) return '';
  fee = fee > 0 ? fee : 0;
  const feeTxt = fee ? ` <small class="muted">(${fmt(amt, a.currency)} + ${fmt(fee, a.currency)} ücret)</small>` : '';
  const inTxt = toAmt > 0 ? `+${fmt(toAmt, b.currency)}` : '—';
  return `<b>${esc(accLabel(a))}</b> <span class="exp num">−${fmt(amt + fee, a.currency)}</span>${feeTxt}` +
    ` → <b>${esc(accLabel(b))}</b> <span class="inc num">${inTxt}</span>`;
}
function syncTx(t) {
  const f = F(), tp = dlg.type;
  document.querySelectorAll('#txType button').forEach(b => b.classList.toggle('on', b.dataset.type === tp));
  const a = acc(f.accountId.value), cur = a ? a.currency : 'IQD';
  $('#amtCur').textContent = cur;
  $('#accLbl').textContent = tp === 'transfer' ? 'Çıkan hesap' : (tp === 'income' || tp === 'opening') ? 'Giren hesap' : 'Hesap';

  const isTr = tp === 'transfer', isOpening = tp === 'opening';
  $('#catWrap').classList.toggle('hide', isTr || isOpening);
  $('#toWrap').classList.toggle('hide', !isTr);
  if (!isTr && !isOpening) {
    const prev = t ? t.categoryId : f.categoryId.value;
    f.categoryId.innerHTML = (tp === 'income' ? '<option value="">— Belirtme —</option>' : '') + catOptions(tp);
    if (prev !== undefined && [...f.categoryId.options].some(o => o.value === prev)) f.categoryId.value = prev;
  } else if (isTr) {
    // Hedef hesap: açık olan seçim korunur, yoksa en son transferde kullanılan, o da yoksa ilk uygun hesap.
    const from = f.accountId.value, keep = f.toAccountId.value;
    const pref = keep && keep !== from ? keep
      : ui.lastTrTo && ui.lastTrTo !== from ? ui.lastTrTo
      : accOrdered().find(x => x.id !== from)?.id;
    fillAccSelect(f.toAccountId, pref, from);
  }
  const noTarget = isTr && !f.toAccountId.options.length;
  $('#toWrap').classList.toggle('hide', !isTr || noTarget);
  $('#toEmpty').classList.toggle('hide', !noTarget);
  if (noTarget) $('#quickAccBtn').textContent = cur === 'IQD' ? '+ "Nakit Dolar" hesabı oluştur' : '+ "Nakit Dinar" hesabı oluştur';
  // Ücret çıkan hesabın para biriminde, tutara ek olarak o hesaptan düşer.
  $('#feeWrap').classList.toggle('hide', !isTr || noTarget);
  if (isTr) $('#feeCur').textContent = cur;
  const b = isTr ? acc(f.toAccountId.value) : null;
  const fx = isTr && b && a && b.currency !== a.currency;
  $('#toAmtWrap').classList.toggle('hide', !fx);
  const date = f.date.value || today(), rate = rateAt(date);
  const boxes = { amount: '#amtBox', toAmount: '#toAmtBox', fxRate: '#fxRateBox' };
  for (const k in boxes) $(boxes[k]).classList.remove('auto');
  if (fx) {
    $('#toCur').textContent = b.currency;
    $('#fxDate').textContent = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long' }).format(parse(date));
    const tgt = dlg.fxOrder[0];
    if (!dlg.rateTyped && tgt !== 'fxRate') f.fxRate.value = fmtIn(rate, 'rate');
    const key = n => n === 'fxRate' ? 'rate' : (n === 'amount' ? a.currency : b.currency).toLowerCase();
    const v = {};
    for (const n in boxes) v[key(n)] = num(f[n].value);
    f[tgt].value = fmtIn(solveFx(key(tgt), v.iqd, v.usd, v.rate), key(tgt) === 'rate' ? 'rate' : key(tgt).toUpperCase());
    $(boxes[tgt]).classList.add('auto');
    const R = num(f.fxRate.value);
    $('#fxHint').textContent = `Herhangi ikisini yazın, üçüncüsü hesaplanır. Kayıtlı kur: 1 $ = ${fmtNum(rate)} IQD` +
      (R > 0 && Math.abs(R - rate) >= 0.01 ? ` (fark ${R > rate ? '+' : '−'}${fmtNum(Math.abs(R - rate), 2)})` : '');
    $('#amtHint').textContent = '';
    $('#trHint').innerHTML = trSummary(a, b, num(f.amount.value), num(f.toAmount.value), num(f.fee.value));
    return;
  }
  const amount = num(f.amount.value), other = cur === 'USD' ? 'IQD' : 'USD';
  // Aynı para birimindeki transferde giren tutar, çıkan tutarla aynıdır (ücret ayrıca düşer).
  $('#trHint').innerHTML = isTr ? trSummary(a, b, amount, amount, num(f.fee.value)) : '';
  // Yazılan rakamın nasıl okunduğunu göster ki nokta/virgül karışıklığı hemen fark edilsin.
  $('#amtHint').textContent = amount > 0 ? `= ${fmt(amount, cur)}  ≈ ${fmt(conv(amount, cur, other, rate), other)}` : '';
}
function submitTx(e) {
  e.preventDefault();
  const f = F(), amount = num(f.amount.value);
  if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); f.amount.focus(); return; }
  if (!f.date.value) { toast('Tarih seçin.'); return; }
  const t = {
    id: dlg.id || uid(), ts: dlg.id ? (db.tx.find(x => x.id === dlg.id)?.ts || Date.now()) : Date.now(),
    type: dlg.type, date: f.date.value, accountId: f.accountId.value, amount, note: f.note.value.trim(),
  };
  if (dlg.type === 'transfer') {
    const a = acc(t.accountId), b = acc(f.toAccountId.value);
    if (!b || b.id === a.id) { toast('Farklı bir hedef hesap seçin (önce ikinci bir hesap ekleyin).'); return; }
    t.toAccountId = b.id;
    t.toAmount = a.currency === b.currency ? amount : num(f.toAmount.value);
    if (!(t.toAmount > 0)) { toast('Hedef tutarı veya kuru girin.'); return; }
    t.fee = f.fee.value.trim() ? num(f.fee.value) : 0;
    if (!(t.fee >= 0)) { toast('Transfer ücreti geçersiz.'); f.fee.focus(); return; }
    ui.lastTrAcc = a.id; ui.lastTrTo = b.id;
    if (a.currency !== b.currency && f.saveRate.checked) {
      const R = a.currency === 'IQD' ? amount / t.toAmount : t.toAmount / amount;
      if (Math.abs(R - rateAt(t.date)) >= 0.01) setRate(t.date, R);
    }
  } else if (dlg.type === 'opening') {
    ui.lastOpeningAcc = t.accountId;
  } else {
    t.categoryId = f.categoryId.value;
    if (dlg.type === 'income') ui.lastIncAcc = t.accountId; else ui.lastExpAcc = t.accountId;
  }
  const i = db.tx.findIndex(x => x.id === t.id);
  if (i >= 0) db.tx[i] = t; else db.tx.push(t);
  save(); $('#txDlg').close(); render();
  toast(i >= 0 ? 'İşlem güncellendi' : 'İşlem eklendi');
}

/* ---------- olaylar ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const d = el.dataset;
  switch (d.action) {
    case 'tab': ui.tab = d.tab; ui.editAcc = ui.editCat = ui.newCatParent = ui.newAccParent = null; render(); scrollTo(0, 0); break;
    case 'disp': db.settings.display = d.cur; save(); render(); break;
    case 'period': ui.period = d.p; render(); break;
    case 'shift': ui.anchor = shift(ui.period, ui.anchor, +d.n); render(); break;
    case 'now': ui.anchor = today(); render(); break;
    case 'report': printReport(); break;
    case 'drill': {
      const rg = range(ui.period, ui.anchor);
      ui.f = { q: '', acc: '', cat: d.cat === FEE ? '__transfer' : d.cat, from: rg.start, to: rg.end };
      ui.tab = 'islemler'; render(); scrollTo(0, 0); break;
    }
    case 'clear-f': ui.f = { q: '', acc: '', cat: '', from: '', to: '' }; render(); break;
    case 'new-tx': openTx(d.type); break;
    case 'edit-tx': openTx(null, d.id); break;
    case 'tx-type': dlg.type = d.type; resetFx(); syncTx(); break;
    case 'quick-acc': {
      const f = F(), a = acc(f.accountId.value), currency = a && a.currency === 'USD' ? 'IQD' : 'USD';
      const na = { id: uid(), name: currency === 'USD' ? 'Nakit Dolar' : 'Nakit Dinar', currency, opening: 0 };
      db.accounts.push(na); save(); render();
      f.toAccountId.innerHTML = `<option value="${na.id}"></option>`; f.toAccountId.value = na.id;
      resetFx(); syncTx(); toast(`"${na.name}" hesabı oluşturuldu`);
      break;
    }
    case 'cv-save-rate': {
      const R = num($('#cvRate').value);
      if (!(R > 0)) { toast('Önce kuru yazın veya hesaplatın.'); break; }
      setRate(today(), R); save(); render(); toast('Bugünün kuru kaydedildi');
      break;
    }
    case 'cv-to-tx': {
      const iqd = num($('#cvIQD').value), usd = num($('#cvUSD').value);
      if (!(iqd > 0 && usd > 0)) { toast('Önce dinar ve dolar tutarlarını doldurun.'); break; }
      const from = db.accounts.find(x => x.currency === 'IQD'), to = db.accounts.find(x => x.currency === 'USD');
      if (!from || !to) { toast('Bir dinar ve bir dolar hesabı gerekli.'); break; }
      openTx('transfer', null, { from: from.id, to: to.id, amount: iqd, toAmount: usd });
      break;
    }
    case 'close-dlg': $('#txDlg').close(); break;
    case 'tx-del':
      if (confirm('Bu işlem silinsin mi?')) { db.tx = db.tx.filter(t => t.id !== dlg.id); save(); $('#txDlg').close(); render(); toast('İşlem silindi'); }
      break;
    case 'edit-acc': ui.editAcc = d.id; ui.newAccParent = null; render(); scrollTo(0, 0); break;
    case 'add-subacc':
      ui.editAcc = null; ui.newAccParent = d.id; render(); scrollTo(0, 0);
      $('[data-form=acc] [name=name]').focus();
      break;
    case 'cancel-acc': ui.editAcc = ui.newAccParent = null; render(); break;
    case 'del-acc': {
      const a = acc(d.id), n = db.tx.filter(t => t.accountId === d.id || t.toAccountId === d.id).length, kids = accChildren(d.id);
      if (n) { alert(`"${a.name}" hesabında ${n} işlem var. Önce bu işlemleri silin veya başka hesaba taşıyın.`); break; }
      let msg = `"${a.name}" hesabı silinsin mi?`;
      if (kids.length) msg += `\n\nAlt hesapları (${kids.map(k => k.name).join(', ')}) silinmeyecek, ana hesap olacak.`;
      if (confirm(msg)) {
        db.accounts = db.accounts.filter(x => x.id !== d.id);
        kids.forEach(k => { k.parentId = ''; });
        if (ui.editAcc === d.id) ui.editAcc = null;
        if (ui.newAccParent === d.id) ui.newAccParent = null;
        save(); render();
      }
      break;
    }
    case 'edit-cat': ui.editCat = d.id; ui.newCatParent = null; render(); scrollTo(0, 0); break;
    case 'add-sub':
      ui.editCat = null; ui.newCatParent = d.id; render(); scrollTo(0, 0);
      $('[data-form=cat] [name=name]').focus();
      break;
    case 'cancel-cat': ui.editCat = ui.newCatParent = null; render(); break;
    case 'del-cat': {
      const c = cat(d.id), n = db.tx.filter(t => t.categoryId === d.id).length, kids = children(d.id);
      let msg = `"${c.name}" silinsin mi?`;
      if (n) msg += `\n\n${n} işlem "Kategorisiz" olacak.`;
      if (kids.length) msg += `\n\n${kids.length} alt kategorisi (${kids.map(k => k.name).join(', ')}) silinmeyecek, ana kategori olacak.`;
      if (confirm(msg)) {
        db.categories = db.categories.filter(x => x.id !== d.id);
        kids.forEach(k => { k.parentId = ''; });
        db.tx.forEach(t => { if (t.categoryId === d.id) t.categoryId = ''; });
        if (ui.newCatParent === d.id) ui.newCatParent = null;
        if (ui.editCat === d.id) ui.editCat = null;
        save(); render();
      }
      break;
    }
    case 'paste-rate':
      if (!navigator.clipboard || !navigator.clipboard.readText) { toast('Kutuya basılı tutup Yapıştır deyin.'); break; }
      navigator.clipboard.readText().then(txt => { $('#rateText').value = txt; renderFound(); })
        .catch(() => toast('Yapıştırılamadı — kutuya basılı tutup Yapıştır deyin.'));
      break;
    case 'use-rate': {
      const date = $('#rateTextDate').value || today();
      setRate(date, +d.rate); save(); render();
      toast(`Kur kaydedildi: 1 $ = ${fmtNum(+d.rate, +d.rate % 1 ? 2 : 0)} IQD`);
      break;
    }
    case 'del-rate':
      if (confirm('Bu kur kaydı silinsin mi?')) { db.rates = db.rates.filter(r => r.id !== d.id); save(); render(); }
      break;
    case 'pay': openPay(d.id); break;
    case 'close-pay': payId = null; $('#payDlg').close(); break;
    case 'pay-all': {
      const x = db.debts.find(y => y.id === payId);
      if (x) $('#payForm').elements.amount.value = fmtIn(debtLeft(x), 'any');
      break;
    }
    case 'del-pay': {
      const x = db.debts.find(y => y.id === d.id), p = x && x.payments.find(y => y.id === d.pay);
      if (x && p && confirm(`${fmt(p.amount, x.currency)} tutarındaki ödeme kaydı silinsin mi?`)) {
        if (p.txId) db.tx = db.tx.filter(t => t.id !== p.txId);
        x.payments = x.payments.filter(y => y.id !== d.pay); save(); render(); toast('Ödeme silindi');
      }
      break;
    }
    case 'del-debt': {
      const x = db.debts.find(y => y.id === d.id); if (!x) break;
      const kind = x.dir === 'lent' ? 'alacak' : 'borç';
      const extra = x.payments.length ? `\n\n${x.payments.length} ödeme/tahsilat kaydı da silinecek.` : '';
      if (confirm(`“${x.person}” için ${kind} kaydı silinsin mi?${extra}`)) {
        const ids = new Set([x.txId, ...x.payments.map(p => p.txId)].filter(Boolean));
        if (ids.size) db.tx = db.tx.filter(t => !ids.has(t.id));
        db.debts = db.debts.filter(y => y.id !== d.id); save(); render(); toast('Kayıt silindi');
      }
      break;
    }
    case 'export': doBackup(); break;
    case 'import': $('#importFile').click(); break;
    case 'restore-snap': {
      const sn = loadSnap(); if (!sn) { toast('Geri alınacak önceki veri yok.'); break; }
      if (confirm(`${fmtTs(sn.ts)} tarihindeki önceki veriler geri yüklensin mi?`)) {
        const previous = sn.data;
        takeSnapshot('geri alma öncesi');
        db = norm(previous); save(); ui.tab = 'ozet'; render(); toast('Önceki veriler geri yüklendi');
      }
      break;
    }
    case 'reset':
      if (confirm('TÜM veriler silinecek (işlemler, hesaplar, kategoriler, kurlar). Emin misiniz?') && confirm('Son kez: yedek aldınız mı? Silinsin mi?')) {
        takeSnapshot('tüm verileri silme öncesi');
        db = seed(); save(); ui.tab = 'ozet'; render(); toast('Sıfırlandı');
      }
      break;
  }
});

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.id === 'txForm') return submitTx(e);
  if (form.id === 'payForm') return submitPay(e);
  e.preventDefault();
  const v = Object.fromEntries(new FormData(form));
  if (form.dataset.form === 'acc') {
    const name = (v.name || '').trim(); if (!name) return;
    const opening = v.opening ? num(v.opening) : 0;
    if (isNaN(opening)) { toast('Açılış bakiyesi geçersiz.'); return; }
    const par = v.parentId ? acc(v.parentId) : null;
    if (ui.editAcc) {
      const a = acc(ui.editAcc);
      a.name = name; a.opening = opening; if (v.currency) a.currency = v.currency;
      // Alt hesabı olan hesap ana hesap kalır (parentId alanı kapalı gelir).
      a.parentId = accChildren(a.id).length || !par || par.id === a.id ? '' : par.id;
      ui.editAcc = null; toast('Hesap güncellendi');
    } else {
      db.accounts.push({ id: uid(), name, currency: v.currency, opening, parentId: par ? par.id : '' });
      toast(par ? `"${par.name}" altına eklendi` : 'Hesap eklendi');
      // Aynı ana hesaba art arda kart eklemeyi kolaylaştırmak için form açık kalır.
    }
  } else if (form.dataset.form === 'cat') {
    const name = (v.name || '').trim(); if (!name) return;
    const par = v.parentId ? cat(v.parentId) : null;
    const type = par ? par.type : (v.type || 'expense');
    if (ui.editCat) {
      const c = cat(ui.editCat), kids = children(c.id);
      const parentId = kids.length ? '' : (par ? par.id : '');
      if (c.type !== type && db.tx.some(t => t.categoryId === c.id || kids.some(k => k.id === t.categoryId))) {
        toast('İşlemi olan kategorinin türü (gider/gelir) değiştirilemez.'); return;
      }
      Object.assign(c, { name, type, color: v.color, parentId });
      kids.forEach(k => { k.type = type; });
      ui.editCat = null; toast('Kategori güncellendi');
    } else {
      db.categories.push({ id: uid(), name, type, color: v.color, parentId: par ? par.id : '' });
      toast(par ? `"${par.name}" altına eklendi` : 'Kategori eklendi');
      // Aynı ana kategoriye art arda alt kategori eklemeyi kolaylaştırmak için form açık kalır.
    }
  } else if (form.dataset.form === 'rate') {
    const rate = num(v.rate);
    if (!(rate > 0)) { toast('Geçerli bir kur girin.'); return; }
    db.rates = db.rates.filter(r => r.date !== v.date);
    db.rates.push({ id: uid(), date: v.date, rate });
    toast('Kur kaydedildi');
  } else if (form.dataset.form === 'debt') {
    const person = (v.person || '').trim(), amount = num(v.amount), opening = v.entryMode === 'opening';
    const a = opening ? null : acc(v.accountId);
    if (!person) { toast('Kişi adını girin.'); form.elements.person.focus(); return; }
    if (!(amount > 0)) { toast('Geçerli bir tutar girin.'); form.elements.amount.focus(); return; }
    if (!opening && (!a || a.currency !== v.currency)) { toast(`${v.currency} para biriminde bir hesap seçin.`); return; }
    if (!v.date) { toast('Tarih seçin.'); return; }
    const did = uid(), txid = opening ? '' : uid(), note = (v.note || '').trim();
    db.debts.push({
      id: did, dir: v.dir, person, amount, currency: v.currency, accountId: a ? a.id : '', txId: txid,
      date: v.date, note, payments: [], opening,
    });
    if (!opening) {
      db.tx.push({
        id: txid, ts: Date.now(), type: v.dir === 'owed' ? 'debt-in' : 'debt-out', date: v.date,
        accountId: a.id, amount, note, debtId: did, debtKind: v.dir, person, locked: true,
      });
      toast(v.dir === 'lent' ? 'Alacak eklendi · hesaptan düşüldü' : 'Borç eklendi · hesaba girdi');
    } else {
      toast(v.dir === 'lent' ? 'Başlangıç alacağı eklendi' : 'Başlangıç borcu eklendi');
    }
  }
  save(); render();
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter) { ui.f[el.dataset.filter] = el.value; renderTxList(); return; }
  if (el.id === 'rateText') { renderFound(); return; }
  if (el.closest('#txForm')) {
    if (['amount', 'toAmount', 'fxRate'].includes(el.name)) touch(dlg.fxOrder, el.name);
    if (el.name === 'fxRate') dlg.rateTyped = true;
    if (['amount', 'toAmount', 'fxRate', 'fee'].includes(el.name)) syncTx();
    return;
  }
  if (el.dataset.cv) {
    touch(ui.cvOrder, el.dataset.cv);
    const tgt = ui.cvOrder[0], ids = { iqd: '#cvIQD', usd: '#cvUSD', rate: '#cvRate' };
    const v = num($('#cvIQD').value), u = num($('#cvUSD').value), r = num($('#cvRate').value);
    $(ids[tgt]).value = fmtIn(solveFx(tgt, v, u, r), tgt === 'rate' ? 'rate' : tgt.toUpperCase());
    for (const k in ids) $(ids[k] + 'Box').classList.toggle('auto', k === tgt);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('[data-form=debt]') && (el.name === 'currency' || el.name === 'dir' || el.name === 'entryMode')) { syncDebtForm(); return; }
  if (el.closest('#txForm') && (el.name === 'accountId' || el.name === 'toAccountId' || el.name === 'date')) {
    if (el.name !== 'date') resetFx();
    syncTx(); return;
  }
  if (el.name === 'parentId' && el.form?.dataset.form === 'cat') {
    // Üst kategori seçilince tür ondan gelir; yeni kategoride renk de üst kategoriden alınır.
    const p = cat(el.value), f = el.form.elements;
    f.type.disabled = !!p;
    if (p) { f.type.value = p.type; if (!ui.editCat) f.color.value = p.color; }
    return;
  }
  if (el.dataset.setting) {
    db.settings[el.dataset.setting] = el.dataset.setting === 'weekStart' ? +el.value : el.value;
    save(); render(); toast('Kaydedildi'); return;
  }
  if (el.id === 'importFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.accounts) || !Array.isArray(d.categories) || !Array.isArray(d.tx) || !Array.isArray(d.rates)) throw 0;
        if (!confirm(`Yedekte ${d.tx.length} işlem var. Mevcut verilerin yerine geçsin mi?`)) return;
        takeSnapshot('yedekten geri yükleme öncesi');
        db = norm(d); save(); ui.tab = 'ozet'; render(); toast('Yedek yüklendi');
      } catch (_) { alert('Bu dosya geçerli bir yedek değil.'); }
    };
    r.readAsText(el.files[0]);
  }
});

let toastT;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

render();

// İnternet sitesinden açıldığında internetsiz de çalışsın (bilgisayarda dosyadan açınca devre dışı).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// Tarayıcıdan verilerin kendiliğinden silinmemesini iste.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
