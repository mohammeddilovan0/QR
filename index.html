}
const kalkAyar = () => ({ on: K.on, every: K.every, start: K.start, end: K.end, days: K.days, pause: K.pause, tz: new Date().getTimezoneOffset() });

/* Köprüdeki (kopru/worker.js) due() ile aynı kural: çalışma saatleri içinde başlangıçtan itibaren her "every" dakikada bir,
   başlangıç anında değil (09:00 başlıyorsa ilki 09:20). Bitiş başlangıçtan küçükse aralık gece yarısını aşar. */

/* ---------- uygulama kapalıyken: Web Push ---------- */
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';

  let j = {}; try { j = await r.json(); } catch (e) {}
  // Eski köprü /push/ yolunu tanımaz, kur listesi döner.
  if (j.posts || j.channel) throw Object.assign(new Error('eski-kopru'), { code: 'eski-kopru' });
  if (!r.ok || j.error) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { code: j.error === 'kv-yok' ? 'kv-yok' : 'hata' });

/* iOS en fazla 64 bekleyen bildirim tutar. Ayarlar elverirse haftalık/günlük tekrar eden bildirimler kurulur (bir kez kurulur,

const NAT_MAX = 60;
let natT, natRolling = false;
function nativeScheduleSoon() { if (!NATIVE) return; clearTimeout(natT); natT = setTimeout(nativeSchedule, 300); }
function kalkSlots() {
  const s = hm(K.start), e = hm(K.end), span = ((e - s + 1440) % 1440) || 1440, out = [];
  for (const d of K.days) for (let off = K.every; off <= span; off += K.every) {
    const m = s + off;
    out.push({ weekday: (d + Math.floor(m / 1440)) % 7 + 1, hour: Math.floor(m % 1440 / 60), minute: m % 60 });
  }
  return out;
}
const natBase = () => ({ title: 'Kalk biraz 🧍', body: `${K.every} dakikadır oturuyorsun. Kalk, birkaç adım yürü.`, sound: `kalk-${K.sound}.wav` });
async function nativeSchedule() {
  try {
    const pend = ((await LN('getPending')).notifications || []).filter(n => +n.id < 2000); // 2000+: imza hatırlatmaları
    if (pend.length) await LN('cancel', { notifications: pend.map(n => ({ id: +n.id })) });
    natRolling = false;
    if (!K.on || !K.days.length) return;
    const now = Date.now(), slots = kalkSlots(), per = slots.length / K.days.length;
    let list = [];
    if (K.pause <= now) {
      if (K.days.length === 7 && per <= NAT_MAX) list = slots.slice(0, per).map(({ hour, minute }) => ({ schedule: { on: { hour, minute } } }));
      else if (slots.length <= NAT_MAX) list = slots.map(on => ({ schedule: { on } }));
    }
    if (!list.length) {
      natRolling = true;
      for (let t = now, i = 0; i < NAT_MAX; i++) { t = kalkNext(t); if (!t) break; list.push({ schedule: { at: new Date(t) } }); }
    }
    const base = natBase();
    if (list.length) await LN('schedule', { notifications: list.map((x, i) => ({ id: 1000 + i, ...base, ...x })) });
  } catch (e) { kalkPush = { st: 'hata', err: e.message || String(e) }; }

}

/* ---------- SideStore imza süresi (yalnız iPhone uygulamasında) ----------
   Ücretsiz Apple ID ile imza 7 gün geçerli; dolarsa uygulama açılmaz, SideStore'dan yenilemek gerekir.
   Gerçek bitiş tarihi paketteki imzadan okunur (ImzaPlugin); okunamazsa ilk açılıştan 7 gün sayılır. */
const IMZA = KEY + '-imza', IMZA_IDS = [2001, 2002, 2003];
let imzaBitis = 0, imzaTahmin = false;
async function imzaYukle() {
  if (!NATIVE) return;

  try { t = +(await Capacitor.nativePromise('Imza', 'bitis')).bitis || 0; } catch (e) {}
  imzaTahmin = !t;

    let first = 0;
    try { first = +localStorage.getItem(IMZA) || 0; if (!first) localStorage.setItem(IMZA, first = Date.now()); } catch (e) { first = Date.now(); }
    t = first + 7 * 864e5;
  }
  const changed = t !== imzaBitis;
  imzaBitis = t;
  imzaBarDraw();
  if (!changed) return;
  imzaPlanla();
  if (['daha', 'ozet'].includes(ui.tab) && !document.querySelector('dialog[open]')) render();
}
async function imzaPlanla() {
  try {
    await LN('cancel', { notifications: IMZA_IDS.map(id => ({ id })) });
    // Son hatırlatma bitişten 3 saat önce; gece yarısıyla sabah 8 arasına düşerse önceki akşam 20:00.
    const b = imzaBitis, now = Date.now(), sekiz = new Date(b);
    sekiz.setHours(8, 0, 0, 0);
    let son = b - 3 * 36e5;
    if (son < sekiz.getTime()) { const a = new Date(b); a.setDate(a.getDate() - 1); a.setHours(20, 0, 0, 0); son = a.getTime(); }
    const sonNe = `${ymd(new Date(son)) === ymd(new Date(b)) ? 'bugün' : 'yarın'} saat ${hhmm(b)} olunca`;
    const list = [[2001, b - 2 * 864e5, '2 gün sonra'], [2002, b - 864e5, 'yarın bu saatte'], [2003, son, sonNe]]
      .filter(([, at]) => at > now + 60e3)
      .map(([id, at, ne]) => ({ id, title: 'SideStore yenilemesi 📲', sound: 'kalk-zil.wav', schedule: { at: new Date(at) },
        body: `Uygulamanın süresi ${ne} doluyor. SideStore'u aç → My Apps → Refresh All.` }));
    if (list.length) await LN('schedule', { notifications: list });
  } catch (e) {}
}

  </div>`;
}
function imzaAc() {
  ui.tab = 'daha'; render(); scrollTo(0, 0);
  const c = $('#imzaCard'); if (c) c.scrollIntoView({ block: 'center' });
}
if (NATIVE) {
  // İmza hatırlatmasına basınca süre kartının olduğu ekran açılır.
  Capacitor.addListener('LocalNotifications', 'localNotificationActionPerformed', a => {
    const id = +(a && a.notification && a.notification.id);
    if (IMZA_IDS.includes(id)) imzaAc();
  });
  imzaYukle();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) imzaYukle(); });
}

function vKalk() {
  const now = Date.now(), paused = K.on && K.pause > now, next = K.on ? kalkNext(Math.max(now, K.pause - 60e3)) : 0;
  const status = !K.on ? 'Kapalı' : !K.days.length ? 'Hiç gün seçili değil' : `Her ${K.every} dk · ${K.start}–${K.end}`;
  return `
  <div class="card">
    <div class="krow"><div style="flex:1"><b style="font-size:17px">Ayağa kalk hatırlatıcısı</b><div class="muted" style="font-size:13px">${esc(status)}</div></div>
      <button class="tgl ${K.on ? 'on' : ''}" data-kalk="toggle" role="switch" aria-checked="${K.on}" aria-label="Hatırlatıcı"></button></div>
    ${K.on && next ? `<div class="knext num">${esc(whenLabel(next))}</div>
      <div class="muted" style="font-size:13px">${paused ? 'Ara verildi · sonraki hatırlatma' : 'Sonraki hatırlatma'}</div>
      <div class="kbtns">${paused ? '<button class="btn" data-kalk="resume">Devam et</button>'
        : '<button class="btn" data-kalk="pause" data-min="60">1 saat ara ver</button><button class="btn" data-kalk="pause-day">Bugünlük yeter</button>'}</div>` : ''}
  </div>
  <div class="card">
    <h2>Ne sıklıkla?</h2>
    <div class="chips" style="margin-top:0">${KALK_EVERY.map(m => `<button class="chip pick ${K.every === m ? 'sel' : ''}" data-kalk="every" data-v="${m}">${m} dk</button>`).join('')}</div>
    <h2 style="margin-top:18px">Hangi saatlerde?</h2>
    <div class="ktimes"><label>Başlangıç<input type="time" data-kalk-set="start" value="${K.start}"></label><label>Bitiş<input type="time" data-kalk-set="end" value="${K.end}"></label></div>
    <div class="chips kdays">${KALK_DAYS.map(([d, l]) => `<button class="chip pick ${K.days.includes(d) ? 'sel' : ''}" data-kalk="day" data-v="${d}">${l}</button>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Bu saatlerin dışında (ör. gece) hatırlatma gelmez.</p>
  </div>
  <div class="card" style="padding-top:8px;padding-bottom:6px">
    <h2 style="margin-top:8px">Ses</h2>
    ${SOUNDS.map(([k, l]) => `<button class="snd ${K.sound === k ? 'sel' : ''}" data-kalk="sound" data-v="${k}"><span>${l}</span><span class="ck">✓</span></button>`).join('')}
    <p class="muted" style="font-size:12px;margin:6px 4px 10px">Dokununca dinlersiniz. ${NATIVE ? 'Seçilen ses uygulama kapalıyken de çalar.' : 'Seçilen ses uygulama açıkken çalar. Uygulama kapalıyken iPhone bildirimde kendi sesini çalar; web uygulamalarında bu sesi değiştirmeye iOS izin vermiyor.'}</p>
  </div>
  <div class="card" id="kalkPush">${vPush()}</div>`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-kalk]'); if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.kalk) {
    case 'ban-close': kalkBanClose(); return;
    case 'toggle':
      K.on = !K.on; K.pause = 0; saveKalk(); render();
      if (K.on) { audio(); if (NATIVE) pushEnable(); else if (pushOk() && db.settings.bridge && Notification.permission === 'default') pushEnable(); }
      return;
    case 'every': K.every = +v; break;
    case 'day': { const d = +v; K.days = K.days.includes(d) ? K.days.filter(x => x !== d) : [...K.days, d]; break; }
    case 'sound': K.sound = v; saveKalk(false); playSound(v); render(); return;
    case 'pause': K.pause = Date.now() + (+el.dataset.min) * 60e3; toast('1 saat ara verildi'); break;
    case 'pause-day': { const t = new Date(); t.setHours(24, 0, 0, 0); K.pause = t.getTime(); toast('Yarına kadar hatırlatma yok'); break; }
    case 'resume': K.pause = 0; break;
    case 'push-on': pushEnable(); return;
    case 'check': kalkCheck(true); return;
    case 'test':
      if (NATIVE) {
        LN('schedule', { notifications: [{ id: 999, ...natBase(), schedule: { at: new Date(Date.now() + 5e3) } }] })
          .then(() => toast('5 saniye sonra gelir, istersen uygulamayı kapat')).catch(e => toast('Kurulamadı: ' + e.message));
        return;
      }
      el.disabled = true;
      bridgeCall('test', { endpoint: kalkPush.ep }).then(() => toast('Gönderildi, birkaç saniye içinde gelir'))
        .catch(e => toast('Gönderilemedi: ' + e.message)).finally(() => { el.disabled = false; });
      return;
    default: return;
  }
  saveKalk(); render();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.kalkSet;
  if (!k || hm(e.target.value) === null) return;
  K[k] = e.target.value; saveKalk(); render();
});
// Açılışta: köprüdeki ayarlar güncel kalsın (saat dilimi, iPhone'un yenilediği abonelik).
if (K.on) pushSyncSoon();

render();
if (db.settings.bridge) loadLive();

// İnternet sitesinden açıldığında internetsiz de çalışsın (bilgisayarda dosyadan açınca devre dışı).
if ('serviceWorker' in navigator && !NATIVE && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  // Yeni sürüm devreye girince sayfayı bir kez yenile ki eski kod açık kalmasın.
  const hadCtrl = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadCtrl && !reloaded) { reloaded = true; location.reload(); }
  });
}
// Tarayıcıdan verilerin kendiliğinden silinmemesini iste.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
